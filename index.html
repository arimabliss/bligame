<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050a05">
<title>OPEN WORLD — GTA EDITION</title>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--g:#39ff6a;--gd:#1a7a35;--a:#ffb830;--r:#ff3b3b;--b:#4fc3f7;--p:#c084fc;--bg:#050a05;--pn:rgba(5,12,5,.88);--br:rgba(57,255,106,.22);--tx:#c8f5d2;--dm:#5c8a65;--fh:'Rajdhani',sans-serif;--fm:'Share Tech Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--fh);color:var(--tx);user-select:none;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0;z-index:1;background:#0a0a0a;filter:saturate(0.8) contrast(1.1)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,4,0,.8) 100%)}
#scanlines{position:fixed;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px)}
#nightov{position:fixed;inset:0;pointer-events:none;z-index:7;background:rgba(0,0,20,.6);opacity:0;transition:opacity 2s}
#nightov.on{opacity:1}
canvas#rainc{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:0;transition:opacity 1s}
canvas#rainc.on{opacity:1}
canvas#gunlayer{position:fixed;inset:0;pointer-events:none;z-index:12}
#dmgflash{position:fixed;inset:0;pointer-events:none;z-index:60;background:rgba(255,0,0,.5);opacity:0;transition:opacity .1s}
#dmgflash.on{opacity:1}

/* MENU */
#menu{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 55%,rgba(57,255,106,.1) 0%,rgba(0,4,0,.98) 70%)}
#menu.gone{display:none}
.mpanel{width:min(480px,95vw);display:flex;flex-direction:column;align-items:center;animation:mIn .5s ease}
@keyframes mIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.mtitle{font-size:clamp(40px,9vw,72px);font-weight:700;letter-spacing:.22em;color:var(--g);text-shadow:0 0 35px var(--g);line-height:1}
.msub{font-family:var(--fm);font-size:10px;color:var(--dm);letter-spacing:.4em;margin:6px 0 28px}
#pname{width:100%;background:var(--pn);border:1px solid var(--br);padding:12px 16px;color:var(--tx);font-size:16px;font-weight:600;outline:none;border-radius:4px;margin-bottom:16px;text-align:center}
.mbtn{width:100%;padding:15px 20px;margin:6px 0;background:rgba(5,12,5,.75);border:1px solid var(--br);border-radius:4px;font-size:18px;font-weight:600;letter-spacing:.12em;color:var(--g);cursor:pointer;text-align:center;transition:all .2s}
.mbtn:hover{background:rgba(57,255,106,.15);box-shadow:0 0 20px rgba(57,255,106,.3);transform:translateY(-2px)}

/* HUD */
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;display:none;flex-direction:column}
#hud.on{display:flex}
#rw{pointer-events:all;position:absolute;bottom:25px;left:25px;width:160px;height:160px;border-radius:50%;border:3px solid var(--g);box-shadow:0 0 20px rgba(57,255,106,.4),inset 0 0 20px rgba(0,0,0,.8);overflow:hidden;background:#000}
#minimap{width:100%;height:100%;border-radius:50%}
#rsweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,rgba(57,255,106,.2) 60deg,transparent 60deg);animation:sweep 3s linear infinite}
@keyframes sweep{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#rcenter{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;background:var(--g);border-radius:50%;box-shadow:0 0 10px var(--g)}

#gtar{position:absolute;bottom:25px;right:25px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#moneyd{font-family:var(--fm);font-size:28px;font-weight:700;color:var(--g);text-shadow:0 0 15px var(--g)}
#wantedw{display:flex;gap:4px}
.star{font-size:20px;color:#1a1a1a;text-shadow:0 0 2px #000;transition:all .2s}
.star.lit{color:var(--a);text-shadow:0 0 10px var(--a)}
.barr{display:flex;align-items:center;gap:8px}
.brl{font-family:var(--fm);font-size:10px;color:var(--dm);width:30px;text-align:right}
.bro{width:130px;height:10px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.bri{height:100%;border-radius:2px;transition:width .2s}
#hpbar{background:linear-gradient(90deg,#ff4444,#ff7070)}
#arbar{background:linear-gradient(90deg,#4fc3f7,#81d4fa)}

#weaponhud{position:absolute;bottom:25px;right:50%;transform:translateX(50%);display:flex;align-items:center;gap:10px;background:var(--pn);border:1px solid var(--br);padding:8px 16px;border-radius:4px}
#wicon{font-size:24px}
#wname{font-family:var(--fm);font-size:12px;color:var(--a)}
#wammo{font-family:var(--fm);font-size:16px;color:var(--tx)}
#wreserve{font-family:var(--fm);font-size:12px;color:var(--dm)}

#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px;pointer-events:none;z-index:14;opacity:.8}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:var(--g);box-shadow:0 0 6px var(--g)}
#crosshair::before{width:100%;height:2px;top:11px}
#crosshair::after{width:2px;height:100%;left:11px}

#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--pn);border:1px solid var(--br);padding:12px 28px;font-family:var(--fm);font-size:14px;color:var(--g);opacity:0;transition:all .3s;pointer-events:none;z-index:100;border-radius:4px;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

#missionh{position:absolute;top:80px;left:25px;background:var(--pn);border-left:4px solid var(--a);padding:15px 20px;border-radius:0 4px 4px 0;display:none;border:1px solid var(--br);border-left-width:4px;border-left-color:var(--a);box-shadow:0 5px 20px rgba(0,0,0,.5)}
#missionh.on{display:block}
#mname{font-family:var(--fm);font-size:14px;color:var(--a);margin-bottom:5px;letter-spacing:.1em}
#mobjective{font-size:15px;font-weight:600;color:var(--tx)}
#mprog{margin-top:8px;height:4px;background:rgba(255,184,48,.2);border-radius:2px;overflow:hidden}
#mprogi{height:100%;background:var(--a);width:0%;transition:width .3s}

/* OVERLAYS */
#overlay{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;background:rgba(0,4,0,.93);backdrop-filter:blur(10px)}
#overlay.open{display:flex}
.modal{width:min(600px,95vw);background:var(--pn);border:1px solid var(--br);border-radius:8px;padding:25px;max-height:85vh;overflow-y:auto}
.modal h2{font-family:var(--fm);color:var(--g);margin-bottom:15px;letter-spacing:.1em}
.mission-item{display:flex;gap:15px;padding:15px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;transition:background .2s}
.mission-item:hover{background:rgba(57,255,106,.1)}
.mission-icon{font-size:30px}
.mission-info{flex:1}
.mission-name{font-size:18px;font-weight:700}
.mission-desc{font-size:13px;color:var(--dm);margin-top:4px}
.mission-reward{font-family:var(--fm);color:var(--a);margin-top:6px}
.close-btn{background:var(--r);color:#fff;border:none;padding:12px;border-radius:4px;cursor:pointer;font-family:var(--fm);margin-top:20px;width:100%;font-size:14px;font-weight:bold;transition:background .2s}
.close-btn:hover{background:#d32f2f}

/* WEAPON WHEEL */
#wheel{position:fixed;inset:0;z-index:600;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(5px)}
#wheel.open{display:flex}
#wheel-inner{position:relative;width:300px;height:300px;border-radius:50%;background:rgba(5,12,5,.9);border:1px solid var(--br);box-shadow:0 0 40px rgba(0,0,0,.8)}
.wslot{position:absolute;width:70px;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,20,10,.8);border:1px solid var(--br);border-radius:50%;cursor:pointer;transition:all .2s;transform:translate(-50%,-50%)}
.wslot:hover,.wslot.active{background:rgba(57,255,106,.2);border-color:var(--g);box-shadow:0 0 20px rgba(57,255,106,.4);scale:1.15}
.wslot span{font-size:24px}
.wslot small{font-size:8px;color:var(--dm);margin-top:4px;font-family:var(--fm)}
</style>
</head>
<body>

<div id="map"></div>
<div id="nightov"></div>
<div id="rainc"></div>
<div id="vignette"></div>
<div id="scanlines"></div>
<div id="dmgflash"></div>
<canvas id="gunlayer"></canvas>

<div id="hud">
    <div id="rw">
        <div id="minimap"></div>
        <div id="rsweep"></div>
        <div id="rcenter"></div>
    </div>
    <div id="gtar">
        <div id="moneyd">$0</div>
        <div id="wantedw">
            <span class="star" id="s1">★</span><span class="star" id="s2">★</span>
            <span class="star" id="s3">★</span><span class="star" id="s4">★</span><span class="star" id="s5">★</span>
        </div>
        <div class="barr"><span class="brl">HP</span><div class="bro"><div class="bri" id="hpbar" style="width:100%"></div></div></div>
        <div class="barr"><span class="brl">ARM</span><div class="bro"><div class="bri" id="arbar" style="width:75%"></div></div></div>
    </div>
    <div id="weaponhud">
        <span id="wicon">🔫</span>
        <div style="display:flex;flex-direction:column">
            <span id="wname">PISTOL</span>
            <span id="wammo">12 <span id="wreserve">/ 60</span></span>
        </div>
    </div>
    <div id="crosshair"></div>
    <div id="missionh">
        <div id="mname">MISSION</div>
        <div id="mobjective">Objective</div>
        <div id="mprog"><div id="mprogi"></div></div>
    </div>
</div>
<div id="toast"></div>

<div id="menu">
    <div class="mpanel">
        <div class="mtitle">OPEN WORLD</div>
        <div class="msub">GTA TOP-DOWN ENGINE v6.0</div>
        <input type="text" id="pname" value="Player_01" maxlength="14" autocomplete="off">
        <button class="mbtn" id="mplay">▶ ENTER THE CITY</button>
        <button class="mbtn" id="mhelp">📖 CONTROLS & HELP</button>
    </div>
</div>

<div id="wheel">
    <div id="wheel-inner"></div>
</div>

<div id="overlay">
    <div class="modal">
        <h2>📋 AVAILABLE MISSIONS</h2>
        <div id="mission-list"></div>
        <button class="close-btn" onclick="document.getElementById('overlay').classList.remove('open')">CLOSE</button>
    </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   OPEN WORLD — GTA TOP-DOWN ENGINE
   Dense, monolithic single-file engine.
═══════════════════════════════════════════════════════════════ */

const G = {
    screen: 'menu', name: 'Player',
    pos: { lng: -73.985, lat: 40.758 }, // Times Square
    heading: 0, speed: 0, vx: 0, vy: 0,
    vehicleMode: false,
    health: 100, armor: 75, money: 0,
    wanted: 0, wantedTimer: null,
    map: null, minimap: null,
    playerMarker: null,
    keys: {},
    entities: [], // NPCs, Cars, Cops
    // Physics constants
    FOOT_SPEED: 4.0, CAR_SPEED: 22.0, FRICTION: 0.88,
    // Weapons
    gunIndex: 0, ammo: [],
    guns: [
        { id:'pistol', icon:'🔫', name:'PISTOL', damage:25, rate:400, spread:0.02, mag:12, maxReserve:60, reloadTime:1200 },
        { id:'smg', icon:'🔫', name:'SMG', damage:15, rate:100, spread:0.05, mag:30, maxReserve:120, reloadTime:1500, auto:true },
        { id:'shotgun', icon:'💥', name:'SHOTGUN', damage:80, rate:800, spread:0.1, mag:6, maxReserve:24, reloadTime:2000 },
        { id:'sniper', icon:'🎯', name:'SNIPER', damage:150, rate:1500, spread:0.001, mag:5, maxReserve:15, reloadTime:2500 },
    ],
    reloading: false, lastShot: 0,
    // Time
    gameTime: 720, // 12:00 PM
    isNight: false,
    // Missions
    activeMission: null, missionTarget: null, missionStage: 0,
    waypointMarker: null, gpsLoaded: false,
    // Audio
    aCtx: null
};

// ─── INIT & UI ──────────────────────────────────────────────────
document.getElementById('mplay').addEventListener('click', () => {
    G.name = document.getElementById('pname').value || 'Player';
    document.getElementById('menu').classList.add('gone');
    document.getElementById('hud').classList.add('on');
    G.screen = 'game';
    initMap();
    initAudio();
    initMissions();
    bindControls();
    setupWeapons();
    
    // Spawn loop
    setInterval(spawnEntity, 500);
    setInterval(systemTick, 1000);
    
    requestAnimationFrame(gameLoop);
    toast('Welcome to the streets, ' + G.name);
});

document.getElementById('mhelp').addEventListener('click', () => {
    alert("CONTROLS:\nWASD / Arrows: Move\nV: Toggle Vehicle\nLeft Click: Shoot\nR: Reload\nG: Weapon Wheel\nM: Mission Board\nN: Toggle Night\nR: Toggle Rain\n\nSURVIVE. GET RICH.");
});

// ─── MAP ENGINE ─────────────────────────────────────────────────
function initMap() {
    G.map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/liberty', // Free 3D style
        center: [G.pos.lng, G.pos.lat],
        zoom: 17, pitch: 65, bearing: 0,
        antialias: true, attributionControl: false, maxZoom: 19
    });

    G.map.on('load', () => {
        G.minimap = new maplibregl.Map({
            container: 'minimap', style: 'https://tiles.openfreemap.org/styles/positron',
            center: [G.pos.lng, G.pos.lat], zoom: 14, interactive: false, attributionControl: false, pitch: 0
        });

        // Player Marker
        const el = document.createElement('div');
        el.innerHTML = `<div style="width:22px;height:22px;background:var(--g);border-radius:50%;border:3px solid #fff;box-shadow:0 0 20px var(--g);"></div>`;
        G.playerMarker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([G.pos.lng, G.pos.lat]).addTo(G.map);

        // GPS Line
        G.map.addSource('gps', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } } });
        G.map.addLayer({ id: 'gps', type: 'line', source: 'gps', paint: { 'line-color': '#ffb830', 'line-width': 5, 'line-dasharray': [2, 2], 'line-opacity': 0.8 } });
        G.gpsLoaded = true;
    });

    // Shooting via Map Click
    let lastClick = 0;
    G.map.on('click', (e) => {
        if (Date.now() - lastClick < 300) fireWeapon(e.lngLat.lng, e.lngLat.lat);
        lastClick = Date.now();
    });
    
    // Rain Canvas
    G.rainCanvas = document.getElementById('rainc');
    G.rainCtx = G.rainCanvas.getContext('2d');
    G.rainCanvas.width = window.innerWidth; G.rainCanvas.height = window.innerHeight;
    G.rainDrops = Array.from({length: 100}, () => ({ x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight, l: Math.random()*20+10, s: Math.random()*10+5 }));
}

// ─── GAME LOOP & PHYSICS ────────────────────────────────────────
let lastTime = performance.now();
function gameLoop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    if (G.screen === 'game') {
        updatePhysics(dt);
        updateCamera();
        updateEntities(dt);
        updateMissionTracker();
        updateHUD();
        if (G.rainActive) drawRain();
    }
    requestAnimationFrame(gameLoop);
}

function updatePhysics(dt) {
    const maxSpeed = G.vehicleMode ? G.CAR_SPEED : G.FOOT_SPEED;
    const rad = (G.heading * Math.PI) / 180;
    let ax = 0, ay = 0;

    if (G.keys['w'] || G.keys['arrowup']) { ax -= Math.sin(rad); ay += Math.cos(rad); }
    if (G.keys['s'] || G.keys['arrowdown']) { ax += Math.sin(rad); ay -= Math.cos(rad); }
    if (G.keys['a'] || G.keys['arrowleft']) { ax -= Math.cos(rad); ay -= Math.sin(rad); }
    if (G.keys['d'] || G.keys['arrowright']) { ax += Math.cos(rad); ay += Math.sin(rad); }

    const mg = Math.sqrt(ax * ax + ay * ay);
    if (mg > 1) { ax /= mg; ay /= mg; }

    const accel = G.vehicleMode ? 10.0 : 5.0;
    G.vx += ax * accel * dt; G.vy += ay * accel * dt;

    G.vx *= Math.pow(G.FRICTION, dt * 60); G.vy *= Math.pow(G.FRICTION, dt * 60);

    const speed = Math.sqrt(G.vx * G.vx + G.vy * G.vy);
    if (speed > maxSpeed) { G.vx = (G.vx / speed) * maxSpeed; G.vy = (G.vy / speed) * maxSpeed; }

    // Convert to degrees
    const degPerMeter = 1 / 111320;
    G.pos.lng += G.vx * degPerMeter * dt;
    G.pos.lat += G.vy * degPerMeter * dt;

    if (speed > 0.5) G.heading = Math.atan2(-G.vx, G.vy) * 180 / Math.PI;
    G.playerMarker.setLngLat([G.pos.lng, G.pos.lat]);
}

function updateCamera() {
    if (G.speed > 0.1) {
        G.map.easeTo({ center: [G.pos.lng, G.pos.lat], bearing: G.heading, duration: 100, easing: (t) => t * (2 - t) });
    }
    G.minimap.setCenter([G.pos.lng, G.pos.lat]);
}

// ─── AI & ENTITIES ──────────────────────────────────────────────
function spawnEntity() {
    if (G.entities.length > 25) return;
    const isCar = Math.random() > 0.6;
    const angle = Math.random() * Math.PI * 2;
    const dist = 0.003 + Math.random() * 0.005;
    const eLng = G.pos.lng + Math.cos(angle) * dist;
    const eLat = G.pos.lat + Math.sin(angle) * dist;

    const el = document.createElement('div');
    el.innerHTML = isCar ? '🚗' : '🚶';
    el.style.fontSize = isCar ? '24px' : '18px';
    el.style.filter = 'drop-shadow(0 0 5px rgba(0,0,0,0.8))';
    const marker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([eLng, eLat]).addTo(G.map);

    G.entities.push({ id: Math.random().toString(36).substr(2, 9), type: isCar ? 'car' : 'ped', lng: eLng, lat: eLat, vx: 0, vy: 0, hp: isCar ? 100 : 30, marker, isPolice: false });
}

function updateEntities(dt) {
    const degPerMeter = 1 / 111320;
    G.entities.forEach(e => {
        if (e.isPolice) {
            const dx = G.pos.lng - e.lng, dy = G.pos.lat - e.lat;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 0.00005) { e.vx = (dx / dist) * 15.0; e.vy = (dy / dist) * 15.0; }
        } else if (Math.random() < 0.05) {
            e.vx = (Math.random() - 0.5) * 6.0; e.vy = (Math.random() - 0.5) * 6.0;
        }
        e.vx *= Math.pow(0.9, dt * 60); e.vy *= Math.pow(0.9, dt * 60);
        e.lng += e.vx * degPerMeter * dt; e.lat += e.vy * degPerMeter * dt;
        e.marker.setLngLat([e.lng, e.lat]);
        
        // Police collision
        if (e.isPolice && distTo(e, G.pos) < 0.0001) takeDamage(10);
    });
}

// ─── COMBAT & WEAPONS ───────────────────────────────────────────
function setupWeapons() {
    G.ammo = G.guns.map(g => ({ mag: g.mag, reserve: Math.floor(g.maxReserve / 2) }));
    updateWeaponHUD();
}

function fireWeapon(targetLng, targetLat) {
    const g = G.guns[G.gunIndex], a = G.ammo[G.gunIndex];
    if (G.reloading || Date.now() - G.lastShot < g.rate || a.mag <= 0) return;
    
    G.lastShot = Date.now(); a.mag--;
    updateWeaponHUD();
    playSound('shot');

    const ctx = document.getElementById('gunlayer').getContext('2d');
    const from = G.map.project([G.pos.lng, G.pos.lat]);
    const to = G.map.project([targetLng, targetLat]);

    // Tracer
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y);
    ctx.strokeStyle = g.id === 'sniper' ? '#4fc3f7' : '#ffb830'; ctx.lineWidth = 2; ctx.stroke();
    
    // Muzzle flash
    ctx.beginPath(); ctx.arc(from.x, from.y, 15, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    setTimeout(() => ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height), 60);

    // Hit detection
    G.entities.forEach((e, i) => {
        if (Math.sqrt(Math.pow(e.lng - targetLng, 2) + Math.pow(e.lat - targetLat, 2)) * 111320 < 15) {
            e.hp -= g.damage;
            if (e.hp <= 0) {
                e.marker.remove(); G.entities.splice(i, 1);
                addMoney(e.isPolice ? 500 : 50);
                if (!e.isPolice) addWanted();
            }
        }
    });

    if (a.mag === 0) startReload();
}

function startReload() {
    const g = G.guns[G.gunIndex], a = G.ammo[G.gunIndex];
    if (G.reloading || a.reserve <= 0) return;
    G.reloading = true; toast('RELOADING...');
    setTimeout(() => {
        const need = g.mag - a.mag, take = Math.min(need, a.reserve);
        a.mag += take; a.reserve -= take; G.reloading = false;
        updateWeaponHUD(); toast('RELOADED');
    }, g.reloadTime);
}

function openWeaponWheel() {
    const wheel = document.getElementById('wheel'), inner = document.getElementById('wheel-inner');
    wheel.classList.add('open'); inner.innerHTML = '';
    G.guns.forEach((g, i) => {
        const angle = (i / G.guns.length) * 360 - 90, r = 100;
        const x = 150 + Math.cos(angle * Math.PI / 180) * r;
        const y = 150 + Math.sin(angle * Math.PI / 180) * r;
        const div = document.createElement('div');
        div.className = `wslot ${G.gunIndex === i ? 'active' : ''}`;
        div.style.left = x + 'px'; div.style.top = y + 'px';
        div.innerHTML = `<span>${g.icon}</span><small>${g.name}</small>`;
        div.onclick = () => { G.gunIndex = i; wheel.classList.remove('open'); updateWeaponHUD(); };
        inner.appendChild(div);
    });
}

// ─── WANTED & POLICE ────────────────────────────────────────────
function addWanted() {
    if (G.wanted >= 5) return;
    G.wanted++; updateStars();
    toast('⚠️ WANTED LEVEL INCREASED', 'warn');
    if (G.wanted >= 2) spawnPolice();
    clearTimeout(G.wantedTimer);
    G.wantedTimer = setTimeout(() => { G.wanted = Math.max(0, G.wanted - 1); updateStars(); }, 15000);
}

function spawnPolice() {
    const count = Math.min(G.wanted, 4);
    for (let i = G.entities.filter(e=>e.isPolice).length; i < count; i++) {
        const el = document.createElement('div'); el.innerHTML = '🚓'; el.style.fontSize = '28px'; el.style.filter = 'drop-shadow(0 0 8px red)';
        const marker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([G.pos.lng + 0.005, G.pos.lat]).addTo(G.map);
        G.entities.push({ type: 'car', isPolice: true, lng: G.pos.lng + 0.005, lat: G.pos.lat, vx: 0, vy: 0, hp: 200, marker });
    }
}

function takeDamage(amt) {
    G.armor -= amt; if (G.armor < 0) { G.health += G.armor; G.armor = 0; }
    document.getElementById('dmgflash').classList.add('on');
    setTimeout(() => document.getElementById('dmgflash').classList.remove('on'), 100);
    if (G.health <= 0) {
        toast('💀 WASTED', 'warn'); G.health = 100; G.armor = 75; G.wanted = 0;
        G.pos = { lng: -73.985, lat: 40.758 };
        G.entities.filter(e=>e.isPolice).forEach(e=>e.marker.remove());
        G.entities = G.entities.filter(e=>!e.isPolice);
        updateStars();
    }
}

// ─── MISSIONS ───────────────────────────────────────────────────
const MISSIONS = [
    { id: 1, name: 'First Delivery', desc: 'Deliver the package to the marked location.', reward: 1500 },
    { id: 2, name: 'Street Sweep', desc: 'Eliminate 3 targets roaming the streets.', reward: 3000 }
];

function initMissions() {
    document.getElementById('mission-list').innerHTML = MISSIONS.map(m => `
        <div class="mission-item" onclick="startMission(${m.id}, ${m.reward})">
            <div class="mission-icon">📦</div>
            <div class="mission-info"><div class="mission-name">${m.name}</div><div class="mission-desc">${m.desc}</div><div class="mission-reward">+$${m.reward}</div></div>
        </div>`).join('');
}

function startMission(id, reward) {
    document.getElementById('overlay').classList.remove('open');
    G.activeMission = { id, reward };
    const angle = Math.random() * Math.PI * 2, dist = 0.008 + Math.random() * 0.01;
    G.missionTarget = { lng: G.pos.lng + Math.cos(angle) * dist, lat: G.pos.lat + Math.sin(angle) * dist };
    
    if (G.waypointMarker) G.waypointMarker.remove();
    const el = document.createElement('div');
    el.innerHTML = `<div style="width:30px;height:30px;background:var(--a);border-radius:50%;border:3px solid #fff;box-shadow:0 0 20px var(--a);"></div>`;
    G.waypointMarker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([G.missionTarget.lng, G.missionTarget.lat]).addTo(G.map);
    
    document.getElementById('missionh').classList.add('on');
    document.getElementById('mname').textContent = MISSIONS.find(m=>m.id===id).name;
    document.getElementById('mobjective').textContent = 'Follow the GPS route';
    toast('📋 MISSION STARTED', 'gold');
}

function updateMissionTracker() {
    if (!G.activeMission) return;
    if (G.gpsLoaded) {
        G.map.getSource('gps').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: [[G.pos.lng, G.pos.lat], [G.missionTarget.lng, G.missionTarget.lat]] } });
    }
    if (Math.sqrt(Math.pow(G.pos.lng - G.missionTarget.lng, 2) + Math.pow(G.pos.lat - G.missionTarget.lat, 2)) * 111320 < 20) {
        addMoney(G.activeMission.reward);
        toast(`✅ MISSION COMPLETE +$${G.activeMission.reward}`, 'gold');
        if (G.waypointMarker) G.waypointMarker.remove();
        G.map.getSource('gps').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: [] } });
        G.activeMission = null;
        document.getElementById('missionh').classList.remove('on');
    }
}

// ─── CONTROLS & UTILS ───────────────────────────────────────────
function bindControls() {
    document.addEventListener('keydown', (e) => {
        G.keys[e.key.toLowerCase()] = true;
        if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key)) e.preventDefault();
        const k = e.key.toLowerCase();
        if (k === 'v') { G.vehicleMode = !G.vehicleMode; toast(G.vehicleMode ? '🚗 Vehicle' : '🚶 Foot'); }
        if (k === 'g') openWeaponWheel();
        if (k === 'r') startReload();
        if (k === 'm') document.getElementById('overlay').classList.add('open');
        if (k === 'n') { G.isNight = !G.isNight; document.getElementById('nightov').classList.toggle('on', G.isNight); }
        if (k === 'escape') document.getElementById('wheel').classList.remove('open');
    });
    document.addEventListener('keyup', (e) => { G.keys[e.key.toLowerCase()] = false; });
    document.getElementById('wheel').addEventListener('click', (e) => { if(e.target.id==='wheel') document.getElementById('wheel').classList.remove('open'); });
}

function updateHUD() {
    document.getElementById('moneyd').textContent = '$' + G.money.toLocaleString();
    document.getElementById('hpbar').style.width = G.health + '%';
    document.getElementById('arbar').style.width = G.armor + '%';
}

function updateStars() {
    for (let i = 1; i <= 5; i++) document.getElementById('s' + i).classList.toggle('lit', i <= G.wanted);
}

function updateWeaponHUD() {
    const g = G.guns[G.gunIndex], a = G.ammo[G.gunIndex];
    document.getElementById('wicon').textContent = g.icon;
    document.getElementById('wname').textContent = g.name;
    document.getElementById('wammo').innerHTML = `${a.mag} <span id="wreserve" style="font-size:12px;color:var(--dm)">/ ${a.reserve}</span>`;
}

function addMoney(amt) { G.money += amt; updateHUD(); }
function toast(msg, type = '') { const el = document.getElementById('toast'); el.textContent = msg; el.className = 'on ' + type; clearTimeout(el._timer); el._timer = setTimeout(() => el.classList.remove('on'), 3000); }
function distTo(a, b) { return Math.sqrt(Math.pow(a.lng-b.lng, 2) + Math.pow(a.lat-b.lat, 2)); }

function systemTick() {
    // Health regen
    if (G.wanted === 0 && G.health < 100) { G.health = Math.min(100, G.health + 2); updateHUD(); }
    // Random rain
    if (Math.random() < 0.01) {
        G.rainActive = !G.rainActive;
        document.getElementById('rainc').classList.toggle('on', G.rainActive);
    }
}

// ─── RAIN & AUDIO ───────────────────────────────────────────────
function drawRain() {
    const ctx = G.rainCtx;
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    ctx.strokeStyle = 'rgba(174,214,241,0.6)'; ctx.lineWidth = 1;
    G.rainDrops.forEach(d => {
        ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x, d.y + d.l); ctx.stroke();
        d.y += d.s; if (d.y > ctx.canvas.height) { d.y = -d.l; d.x = Math.random() * ctx.canvas.width; }
    });
}

function initAudio() { try { G.aCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
function playSound(type) {
    if (!G.aCtx) return;
    const now = G.aCtx.currentTime;
    if (type === 'shot') {
        const buf = G.aCtx.createBuffer(1, G.aCtx.sampleRate * 0.1, G.aCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
        const src = G.aCtx.createBufferSource(); src.buffer = buf;
        const g = G.aCtx.createGain(); g.gain.setValueAtTime(0.4, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        src.connect(g).connect(G.aCtx.destination); src.start();
    }
}
</script>
