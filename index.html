<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050a05">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>OPEN WORLD — v5.0 GTA EDITION</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- MapLibre GL JS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    
    <!-- PeerJS for Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        /* ═══════════════════════════════════════════════════════════════
           GLOBAL RESET & VARIABLES
        ═══════════════════════════════════════════════════════════════ */
        :root {
            --g: #39ff6a;
            --gd: #1a7a35;
            --a: #ffb830;
            --r: #ff3b3b;
            --b: #4fc3f7;
            --p: #c084fc;
            --pk: #f472b6;
            --bg: #050a05;
            --pn: rgba(5, 12, 5, 0.88);
            --br: rgba(57, 255, 106, 0.22);
            --tx: #c8f5d2;
            --dm: #5c8a65;
            --fh: 'Rajdhani', sans-serif;
            --fm: 'Share Tech Mono', monospace;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--fh);
            color: var(--tx);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ═══════════════════════════════════════════════════════════════
           MAP & OVERLAYS
        ═══════════════════════════════════════════════════════════════ */
        #map {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        #scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 8;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.03) 2px, rgba(0, 0, 0, 0.03) 4px);
        }

        #vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 8;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 4, 0, 0.68) 100%);
        }

        #nightov {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 7;
            background: rgba(0, 0, 20, 0.42);
            opacity: 0;
            transition: opacity 1.2s;
        }
        #nightov.on {
            opacity: 1;
        }

        canvas#rainc {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9;
            opacity: 0;
            transition: opacity 0.8s;
        }
        canvas#rainc.on {
            opacity: 1;
        }

        canvas#gunlayer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 12;
        }

        #dmgflash {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 60;
            background: rgba(255, 0, 0, 0.44);
            opacity: 0;
            transition: opacity 0.15s;
        }
        #dmgflash.on {
            opacity: 1;
        }

        /* ═══════════════════════════════════════════════════════════════
           MAIN MENU
        ═══════════════════════════════════════════════════════════════ */
        #menu {
            position: fixed;
            inset: 0;
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 55%, rgba(57, 255, 106, 0.09) 0%, rgba(0, 4, 0, 0.97) 65%);
        }
        #menu.gone {
            display: none;
        }
        #menu::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(57, 255, 106, 0.022) 3px, rgba(57, 255, 106, 0.022) 4px);
            pointer-events: none;
        }

        .mpanel {
            position: relative;
            z-index: 2;
            width: min(480px, 95vw);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: mpIn 0.5s ease;
        }

        @keyframes mpIn {
            from { opacity: 0; transform: translateY(28px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .mtitle {
            font-size: clamp(38px, 9vw, 68px);
            font-weight: 700;
            letter-spacing: 0.22em;
            color: var(--g);
            text-shadow: 0 0 35px var(--g), 0 0 70px rgba(57, 255, 106, 0.25);
            line-height: 1;
        }

        .msub {
            font-family: var(--fm);
            font-size: 9px;
            color: var(--dm);
            letter-spacing: 0.4em;
            margin: 6px 0 28px;
        }

        .name-char-row {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-bottom: 16px;
            align-items: stretch;
        }

        #pname {
            flex: 1;
            background: var(--pn);
            border: 1px solid var(--br);
            border-radius: 4px;
            padding: 10px 14px;
            color: var(--tx);
            font-family: var(--fh);
            font-size: 15px;
            font-weight: 600;
            outline: none;
            min-width: 0;
        }
        #pname:focus {
            border-color: var(--g);
        }

        #char-pick-btn {
            background: var(--pn);
            border: 1px solid var(--br);
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 22px;
            white-space: nowrap;
            transition: border-color 0.2s;
        }
        #char-pick-btn:hover {
            border-color: var(--g);
        }

        .mbtn {
            width: 100%;
            padding: 13px 20px;
            margin: 4px 0;
            background: rgba(5, 12, 5, 0.75);
            border: 1px solid var(--br);
            border-radius: 4px;
            font-family: var(--fh);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: var(--dm);
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.18s;
            backdrop-filter: blur(6px);
            position: relative;
            overflow: hidden;
        }
        .mbtn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--g);
            opacity: 0;
            transition: opacity 0.18s;
        }
        .mbtn:hover {
            border-color: var(--g);
            color: var(--g);
            box-shadow: 0 0 18px rgba(57, 255, 106, 0.18);
            transform: translateX(5px);
        }
        .mbtn:hover::before {
            opacity: 1;
        }
        .mbtn .bi {
            font-size: 18px;
            width: 26px;
            text-align: center;
        }

        /* ═══════════════════════════════════════════════════════════════
           HUD (GTA STYLE)
        ═══════════════════════════════════════════════════════════════ */
        #hud {
            position: fixed;
            inset: 0;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        #topbar {
            pointer-events: all;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 11px 13px 8px;
            background: linear-gradient(to bottom, rgba(5, 12, 5, 0.93), transparent);
        }

        #sw {
            flex: 1;
            position: relative;
            max-width: 340px;
        }
        #sw input {
            width: 100%;
            background: var(--pn);
            border: 1px solid var(--br);
            border-radius: 4px;
            padding: 7px 8px 7px 28px;
            color: var(--tx);
            font-family: var(--fh);
            font-size: 13px;
            font-weight: 500;
            outline: none;
            backdrop-filter: blur(8px);
            transition: border-color 0.18s;
        }
        #sw input:focus {
            border-color: var(--g);
        }

        /* Radar / Minimap */
        #rw {
            pointer-events: all;
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(5, 12, 5, 0.65);
            border: 2px solid var(--g);
            box-shadow: 0 0 20px rgba(57, 255, 106, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            z-index: 25;
        }
        #minimap {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }
        #rsweep {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 26;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(57, 255, 106, 0.15) 60deg, transparent 60deg);
            animation: sweep 4s linear infinite;
        }
        @keyframes sweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        #rcenter {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: var(--g);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--g);
            z-index: 27;
        }

        /* Right HUD Elements */
        #gtar {
            position: absolute;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            z-index: 25;
        }

        #moneyd {
            font-family: var(--fm);
            font-size: 24px;
            font-weight: 700;
            color: var(--g);
            text-shadow: 0 0 15px var(--g);
        }

        #wantedw {
            display: flex;
            gap: 4px;
            justify-content: flex-end;
        }
        .star {
            font-size: 16px;
            color: #1a1a1a;
            transition: all 0.2s;
        }
        .star.lit {
            color: var(--a);
            text-shadow: 0 0 8px var(--a);
        }

        .barr {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brl {
            font-family: var(--fm);
            font-size: 10px;
            color: var(--dm);
            width: 30px;
            text-align: right;
        }
        .bro {
            width: 120px;
            height: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .bri {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s;
        }
        #hpbar { background: linear-gradient(90deg, #ff4444, #ff7070); }
        #arbar { background: linear-gradient(90deg, #4fc3f7, #81d4fa); }

        /* Center Elements */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 14;
            opacity: 0.6;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: var(--g);
            box-shadow: 0 0 5px var(--g);
        }
        #crosshair::before { width: 100%; height: 2px; top: 11px; }
        #crosshair::after { width: 2px; height: 100%; left: 11px; }

        #toast {
            position: fixed;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--pn);
            border: 1px solid var(--br);
            border-radius: 4px;
            padding: 10px 20px;
            font-family: var(--fm);
            font-size: 13px;
            color: var(--g);
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 100;
            text-align: center;
        }
        #toast.on {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ═══════════════════════════════════════════════════════════════
           MISSION UI
        ═══════════════════════════════════════════════════════════════ */
        #missionh {
            position: fixed;
            top: 80px;
            left: 20px;
            background: var(--pn);
            border-left: 4px solid var(--a);
            padding: 15px 20px;
            border-radius: 0 4px 4px 0;
            display: none;
            z-index: 30;
            max-width: 300px;
            backdrop-filter: blur(8px);
        }
        #missionh.on {
            display: block;
        }
        #mname {
            font-family: var(--fm);
            font-size: 14px;
            color: var(--a);
            margin-bottom: 6px;
        }
        #mobjective {
            font-family: var(--fh);
            font-size: 13px;
            color: var(--tx);
            line-height: 1.4;
        }
        #mprog {
            margin-top: 10px;
            height: 4px;
            background: rgba(255, 184, 48, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }
        #mprogi {
            height: 100%;
            background: var(--a);
            width: 0%;
            transition: width 0.4s;
        }

        /* ═══════════════════════════════════════════════════════════════
           WAYPOINT & MISSION MARKERS
        ═══════════════════════════════════════════════════════════════ */
        .cpmarkwrap {
            width: 30px;
            height: 30px;
            position: relative;
        }
        .cpmarkdot {
            position: absolute;
            width: 16px;
            height: 16px;
            background: var(--a);
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 15px var(--a);
            top: 7px;
            left: 7px;
        }
        .cpmarkring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(255, 184, 48, 0.4);
            animation: cppulse 1.5s ease-out infinite;
        }
        @keyframes cppulse {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* ═══════════════════════════════════════════════════════════════
           WEAPON WHEEL (GTA STYLE)
        ═══════════════════════════════════════════════════════════════ */
        #weaponwheel {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }
        #weaponwheel.open {
            display: flex;
        }
        #wheel {
            position: relative;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(5, 12, 5, 0.9);
            border: 1px solid var(--br);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }
        .wslot {
            position: absolute;
            width: 70px;
            height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 20, 10, 0.8);
            border: 1px solid var(--br);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            transform: translate(-50%, -50%);
        }
        .wslot:hover, .wslot.active {
            background: rgba(57, 255, 106, 0.2);
            border-color: var(--g);
            box-shadow: 0 0 15px rgba(57, 255, 106, 0.3);
            scale: 1.1;
        }
        .wslot span { font-size: 24px; }
        .wslot small { font-size: 8px; color: var(--dm); margin-top: 4px; font-family: var(--fm); }

        /* ═══════════════════════════════════════════════════════════════
           MODAL OVERLAYS (LEADERBOARD, MISSIONS)
        ═══════════════════════════════════════════════════════════════ */
        #overlay {
            position: fixed;
            inset: 0;
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 4, 0, 0.92);
            backdrop-filter: blur(12px);
        }
        #overlay.open {
            display: flex;
        }
        .modal-panel {
            width: min(600px, 95vw);
            max-height: 85vh;
            background: var(--pn);
            border: 1px solid var(--br);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--br);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-title {
            font-family: var(--fm);
            font-size: 16px;
            color: var(--g);
            letter-spacing: 0.1em;
        }
        .modal-close {
            background: none;
            border: 1px solid var(--r);
            color: var(--r);
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--fm);
        }
        .modal-content {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        /* Mission List */
        .mission-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: background 0.2s;
        }
        .mission-item:hover {
            background: rgba(57, 255, 106, 0.05);
        }
        .mission-icon {
            font-size: 28px;
            width: 40px;
            text-align: center;
        }
        .mission-info {
            flex: 1;
        }
        .mission-name {
            font-family: var(--fh);
            font-size: 16px;
            font-weight: 600;
            color: var(--tx);
        }
        .mission-desc {
            font-family: var(--fm);
            font-size: 11px;
            color: var(--dm);
            margin-top: 4px;
        }
        .mission-reward {
            font-family: var(--fm);
            font-size: 12px;
            color: var(--a);
        }
        .mission-status {
            font-family: var(--fm);
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--g);
            color: var(--g);
        }
        .mission-status.done {
            opacity: 0.5;
            border-color: var(--dm);
            color: var(--dm);
        }

        /* Leaderboard */
        .lb-row {
            display: grid;
            grid-template-columns: 40px 1fr 100px 80px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-family: var(--fm);
            font-size: 13px;
        }
        .lb-rank { color: var(--a); font-weight: bold; }
        .lb-name { color: var(--tx); }
        .lb-score { color: var(--g); text-align: right; }
        .lb-kills { color: var(--r); text-align: right; }

        /* Mobile Controls */
        #mobile-controls {
            display: none;
            position: fixed;
            bottom: 180px;
            right: 20px;
            z-index: 50;
        }
        .mob-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(5, 12, 5, 0.6);
            border: 1px solid var(--br);
            color: var(--tx);
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            backdrop-filter: blur(5px);
        }

        @media (max-width: 768px) {
            #topbar { padding: 5px; }
            #sw { max-width: 180px; }
            #rw { width: 100px; height: 100px; bottom: 15px; left: 15px; }
            #gtar { bottom: 15px; right: 15px; }
            #moneyd { font-size: 18px; }
            .bro { width: 80px; height: 8px; }
            #mobile-controls { display: block; }
            #cht { display: none; }
        }

        /* Helper */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- MAP & OVERLAYS -->
    <div id="map"></div>
    <div id="scanlines"></div>
    <div id="vignette"></div>
    <div id="nightov"></div>
    <canvas id="rainc"></canvas>
    <canvas id="gunlayer"></canvas>
    <div id="dmgflash"></div>
    <div id="crosshair"></div>

    <!-- GAME HUD -->
    <div id="hud">
        <!-- Top Bar -->
        <div id="topbar">
            <div id="sw">
                <input id="sinput" type="text" placeholder="Search city, address..." autocomplete="off">
            </div>
            <button class="hb" id="bmis" title="Missions">📋</button>
            <button class="hb" id="blb" title="Leaderboard">🏆</button>
            <button class="hb rb" id="bmenu" title="Menu">☰</button>
        </div>

        <!-- Radar -->
        <div id="rw">
            <div id="minimap"></div>
            <div id="rsweep"></div>
            <div id="rcenter"></div>
        </div>

        <!-- Right HUD -->
        <div id="gtar">
            <div id="moneyd">$0</div>
            <div id="wantedw">
                <span class="star" id="s1">★</span>
                <span class="star" id="s2">★</span>
                <span class="star" id="s3">★</span>
                <span class="star" id="s4">★</span>
                <span class="star" id="s5">★</span>
            </div>
            <div class="barr">
                <span class="brl">HP</span>
                <div class="bro"><div class="bri" id="hpbar" style="width:100%"></div></div>
            </div>
            <div class="barr">
                <span class="brl">ARM</span>
                <div class="bro"><div class="bri" id="arbar" style="width:75%"></div></div>
            </div>
        </div>

        <!-- Mission Panel -->
        <div id="missionh">
            <div id="mname">MISSION</div>
            <div id="mobjective">Objective</div>
            <div id="mprog"><div id="mprogi"></div></div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast"></div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
        <button class="mob-btn" id="mob-veh">🚗</button>
        <button class="mob-btn" id="mob-shoot">💥</button>
    </div>

    <!-- Overlays -->
    <div id="weaponwheel">
        <div id="wheel"></div>
    </div>

    <div id="overlay">
        <div class="modal-panel">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">TITLE</div>
                <button class="modal-close" id="modal-close">✕ CLOSE</button>
            </div>
            <div class="modal-content" id="modal-content"></div>
        </div>
    </div>

    <!-- MENU SCREEN -->
    <div id="menu">
        <div class="mpanel">
            <div class="mtitle">OPEN WORLD</div>
            <div class="msub">GTA EDITION · V5.0</div>
            
            <div class="name-char-row">
                <input type="text" id="pname" placeholder="Your name..." maxlength="14" autocomplete="off">

        </div>
    </div>

    <!-- GAME ENGINE SCRIPT -->
    <script>
    /* ═══════════════════════════════════════════════════════════════
       OPEN WORLD v5.0 — GTA EDITION
       Based on research from GTA 1/2 mechanics, MapLibre 3D, and
       OpenFreeMap vector tiles.
    ═══════════════════════════════════════════════════════════════ */

    // ─── CONFIGURATION & CONSTANTS ─────────────────────────────────
    const STYLES = {
        // OpenFreeMap Liberty style includes 3D buildings natively
        streets: 'https://tiles.openfreemap.org/styles/liberty',
        dark: 'https://tiles.openfreemap.org/styles/positron',
    };

    const COLORS = ['#39ff6a', '#ff3b3b', '#4fc3f7', '#ffb830', '#f472b6', '#c084fc', '#34d399', '#fb923c', '#60a5fa', '#a78bfa'];
    const BOT_NAMES = ['ShadowX', 'TerraNova', 'NightFox', 'UrbanWolf', 'GhostByte', 'CityRacer', 'ReaperZ', 'PhantomK', 'StormRun', 'NeonBlade', 'CrimsonV', 'IronGhost', 'DarkPulse', 'VectorX', 'FrostByte'];

    // ─── GAME STATE ────────────────────────────────────────────────
    const G = {
        screen: 'menu',
        id: Math.random().toString(36).slice(2),
        name: localStorage.getItem('owName') || 'Player_' + Math.floor(Math.random() * 9999),
        color: COLORS[0],
        char: 'dude',
        gun: 0,
        pos: { lng: -74.006, lat: 40.7128 }, // Default NYC
        heading: 0,
        speed: 0,
        vehicleMode: false,
        health: 100,
        armor: 75,
        kills: 0,
        money: 0,
        wanted: 0,
        map: null,
        minimap: null,
        marker: null,
        npcs: [],
        others: {},
        keys: {},
        // Mission state
        activeMission: null,
        activeStage: 0,
        missionWaypoint: null,
        waypointMarker: null,
        // Weapon state
        guns: [
            { id: 'pistol', icon: '🔫', name: 'PISTOL', damage: 22, range: 120, rate: 400, mag: 12, reserve: 60, spread: 0.4, recoil: 1.2, auto: false, headshot: 2.0 },
            { id: 'smg', icon: '🔫', name: 'SMG', damage: 14, range: 180, rate: 75, mag: 30, reserve: 120, spread: 0.8, recoil: 0.6, auto: true, headshot: 1.5 },
            { id: 'rifle', icon: '🪖', name: 'RIFLE', damage: 18, range: 280, rate: 110, mag: 30, reserve: 90, spread: 0.5, recoil: 0.9, auto: true, headshot: 2.0 },
            { id: 'shotgun', icon: '💥', name: 'SHOTGUN', damage: 70, range: 55, rate: 850, mag: 6, reserve: 24, spread: 2.0, recoil: 3.0, auto: false, headshot: 1.2, pellets: 8 },
            { id: 'sniper', icon: '🎯', name: 'SNIPER', damage: 110, range: 999, rate: 2100, mag: 5, reserve: 15, spread: 0.05, recoil: 4.0, auto: false, headshot: 3.0 },
        ],
        ammo: [], // Current ammo state
        // NPC / Traffic
        traffic: [],
        pedestrians: [],
        // PeerJS
        peer: null,
        conns: [],
        roomCode: '',
        // Audio Context
        aCtx: null,
    };

    // Movement constants (calibrated for MapLibre zoom 15)
    const MV = {
        foot: 0.000015,
        sprint: 0.000035,
        vehicle: 0.00008,
        friction: 0.85,
        vx: 0,
        vy: 0,
    };

    // ─── CHARACTERS & MODIFIERS ────────────────────────────────────
    const CHARACTERS = {
        dude: { emoji: '🧍', speed: 1.0, armor: 1.0 },
        cop: { emoji: '👮', speed: 0.9, armor: 1.5 },
        agent: { emoji: '🕵️', speed: 1.1, armor: 1.1 },
        gangster: { emoji: '🧔', speed: 1.0, armor: 0.8 },
    };

    // ─── MISSIONS (Multi-Stage Framework) ──────────────────────────
    const MISSIONS = [
        {
            id: 'heist_1',
            icon: '🏦',
            name: 'The Big Score',
            desc: 'Reach the bank, breach the vault, and escape.',
            reward: 5000,
            stages: [
                { obj: 'Drive to the bank', goal: 'waypoint', target: 'bank', radius: 50 },
                { obj: 'Hold position at the vault', goal: 'hold', target: 10 },
                { obj: 'Escape the police', goal: 'escape', target: 1 }
            ]
        },
        {
            id: 'delivery_1',
            icon: '📦',
            name: 'Special Delivery',
            desc: 'Pick up the package and deliver it to the drop-off.',
            reward: 1200,
            stages: [
                { obj: 'Pick up the package', goal: 'waypoint', target: 'pickup', radius: 40 },
                { obj: 'Deliver to the drop-off', goal: 'waypoint', target: 'dropoff', radius: 40 }
            ]
        },
        {
            id: 'sniper_1',
            icon: '🎯',
            name: 'Sharpshooter',
            desc: 'Eliminate 5 targets with the sniper rifle.',
            reward: 800,
            stages: [
                { obj: 'Equip Sniper and eliminate 5 targets', goal: 'kills_weapon', target: 'sniper', count: 5 }
            ]
        }
    ];

    // ─── INITIALIZATION ────────────────────────────────────────────
    function init() {
        // Load name
        document.getElementById('pname').value = G.name;
        document.getElementById('pname').addEventListener('input', (e) => {
            G.name = e.target.value.trim() || 'Player';
            localStorage.setItem('owName', G.name);
        });

        // Setup menu buttons
        document.getElementById('mplay').addEventListener('click', startGame);
        document.getElementById('mmis').addEventListener('click', () => openOverlay('missions'));
        document.getElementById('mmlb').addEventListener('click', () => openOverlay('leaderboard'));
        document.getElementById('char-pick-btn').addEventListener('click', cycleCharacter);

        // Setup HUD buttons
        document.getElementById('bmis').addEventListener('click', () => openOverlay('missions'));
        document.getElementById('blb').addEventListener('click', () => openOverlay('leaderboard'));
        document.getElementById('bmenu').addEventListener('click', () => {
            G.screen = 'menu';
            document.getElementById('menu').classList.remove('gone');
        });

        // Mobile controls
        document.getElementById('mob-veh').addEventListener('click', toggleVehicle);
        document.getElementById('mob-shoot').addEventListener('click', shoot);
    }

    function startGame() {
        document.getElementById('menu').classList.add('gone');
        G.screen = 'game';
        initMap();
        initAudio();
        
        // Initialize ammo
        G.ammo = G.guns.map(g => ({ mag: g.mag, reserve: g.reserve }));
        
        // Bind controls
        bindControls();
        
        // Start NPC simulation
        setInterval(updateNPCs, 100);
        setInterval(updateTraffic, 200);
        
        // Start game loop
        requestAnimationFrame(gameLoop);
        
        toast('Welcome to the streets, ' + G.name);
    }

    // ─── MAP INITIALIZATION (OpenFreeMap + 3D) ────────────────────
    function initMap() {
        G.map = new maplibregl.Map({
            container: 'map',
            style: STYLES.streets,
            center: [G.pos.lng, G.pos.lat],
            zoom: 15,
            pitch: 60, // Top-down GTA 1 style angle
            bearing: 0,
            antialias: true,
            attributionControl: false
        });

        G.map.on('load', () => {
            // Add 3D buildings (OpenFreeMap Liberty already has them, but ensure layer)
            add3DBuildings();
            
            // Spawn player marker
            spawnMarker();
            
            // Create minimap
            G.minimap = new maplibregl.Map({
                container: 'minimap',
                style: STYLES.streets,
                center: [G.pos.lng, G.pos.lat],
                zoom: 12,
                interactive: false,
                attributionControl: false,
                pitch: 0
            });

            // Add NPC layer
            addNPCLayer();
            
            // Start clock
            setInterval(updateClock, 1000);
        });

        // Map click to shoot
        let lastClick = 0;
        G.map.on('click', (e) => {
            const now = Date.now();
            if (now - lastClick < 300) {
                shootAt(e.lngLat.lng, e.lngLat.lat);
            }
            lastClick = now;
        });
    }

    function add3DBuildings() {
        if (!G.map.getLayer('3db')) {
            // OpenFreeMap Liberty style includes building extrusions natively.
            // We add a highlight layer for visual pop.
            try {
                G.map.addLayer({
                    id: '3db',
                    type: 'fill-extrusion',
                    source: 'openmaptiles',
                    'source-layer': 'building',
                    minzoom: 14,
                    paint: {
                        'fill-extrusion-color': [
                            'interpolate', ['linear'], ['get', 'render_height'],
                            0, '#1a2a1a', 50, '#2a3a2a', 200, '#3a4a3a'
                        ],
                        'fill-extrusion-height': ['get', 'render_height'],
                        'fill-extrusion-base': ['get', 'render_min_height'],
                        'fill-extrusion-opacity': 0.9,
                    }
                });
            } catch(e) { console.warn('3D layer error:', e); }
        }
    }

    function addNPCLayer() {
        if (!G.map.getSource('npcs')) {
            G.map.addSource('npcs', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
            G.map.addLayer({
                id: 'npcDots',
                type: 'circle',
                source: 'npcs',
                paint: {
                    'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 4, 16, 8],
                    'circle-color': ['get', 'color'],
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#fff'
                }
            });
        }
    }

    // ─── PLAYER MARKER ────────────────────────────────────────────
    function spawnMarker() {
        const el = document.createElement('div');
        el.className = 'pm';
        el.innerHTML = '<div class="pr"></div><div class="pd"></div>';
        el.querySelector('.pd').style.background = G.color;
        el.querySelector('.pd').style.boxShadow = `0 0 15px ${G.color}`;
        
        G.marker = new maplibregl.Marker({ element: el, anchor: 'center' })
            .setLngLat([G.pos.lng, G.pos.lat])
            .addTo(G.map);
    }

    // ─── NPC & TRAFFIC SIMULATION ──────────────────────────────────
    function updateNPCs() {
        if (G.screen !== 'game') return;
        
        // Spawn pedestrians if less than 10
        while (G.pedestrians.length < 10) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 0.002 + Math.random() * 0.004;
            G.pedestrians.push({
                id: 'ped_' + Math.random().toString(36).slice(2),
                lng: G.pos.lng + Math.cos(angle) * dist,
                lat: G.pos.lat + Math.sin(angle) * dist,
                vx: (Math.random() - 0.5) * 0.00002,
                vy: (Math.random() - 0.5) * 0.00002,
                color: '#fff',
                hp: 100
            });
        }

        // Update positions
        G.pedestrians.forEach(p => {
            p.lng += p.vx;
            p.lat += p.vy;
            // Simple boundary check
            if (Math.abs(p.lng - G.pos.lng) > 0.005) p.vx *= -1;
            if (Math.abs(p.lat - G.pos.lat) > 0.005) p.vy *= -1;
        });

        // Update map source
        updateNPCLayer();
    }

    function updateTraffic() {
        if (G.screen !== 'game') return;
        
        // Spawn cars if less than 5
        while (G.traffic.length < 5) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 0.003 + Math.random() * 0.005;
            G.traffic.push({
                id: 'car_' + Math.random().toString(36).slice(2),
                lng: G.pos.lng + Math.cos(angle) * dist,
                lat: G.pos.lat + Math.sin(angle) * dist,
                speed: 0.00003 + Math.random() * 0.00002,
                heading: Math.random() * 360,
                color: COLORS[Math.floor(Math.random() * COLORS.length)]
            });
        }

        // Update cars
        G.traffic.forEach(c => {
            const rad = (c.heading * Math.PI) / 180;
            c.lng += Math.sin(rad) * c.speed;
            c.lat += Math.cos(rad) * c.speed;
            // Random turn
            if (Math.random() < 0.05) c.heading += (Math.random() - 0.5) * 90;
        });

        updateNPCLayer();
    }

    function updateNPCLayer() {
        const features = [];
        
        // Add pedestrians
        G.pedestrians.forEach(p => {
            features.push({
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [p.lng, p.lat] },
                properties: { color: p.color, name: 'Ped' }
            });
        });

        // Add traffic
        G.traffic.forEach(c => {
            features.push({
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [c.lng, c.lat] },
                properties: { color: c.color, name: 'Car' }
            });
        });

        // Add other players
        Object.values(G.others).forEach(p => {
            features.push({
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [p.lng, p.lat] },
                properties: { color: p.color || '#fff', name: p.name || 'Player' }
            });
        });

        try {
            G.map.getSource('npcs')?.setData({ type: 'FeatureCollection', features });
        } catch(e) {}
    }

    // ─── GAME LOOP ────────────────────────────────────────────────
    let lastFrame = 0;
    function gameLoop(ts) {
        const dt = Math.min(ts - lastFrame, 50);
        lastFrame = ts;

        if (G.screen === 'game') {
            move(dt);
            updateHUD();
            checkMissionProgress();
        }

        requestAnimationFrame(gameLoop);
    }

    function move(dt) {
        if (G.vehicleMode) moveVehicle(dt);
        else moveOnFoot(dt);
    }

    function moveOnFoot(dt) {
        const spd = MV.foot;
        const rad = (G.heading * Math.PI) / 180;
        let ax = 0, ay = 0;

        if (G.keys['w'] || G.keys['arrowup']) { ax -= Math.sin(rad); ay += Math.cos(rad); }
        if (G.keys['s'] || G.keys['arrowdown']) { ax += Math.sin(rad); ay -= Math.cos(rad); }
        if (G.keys['a'] || G.keys['arrowleft']) { ax -= Math.cos(rad); ay -= Math.sin(rad); }
        if (G.keys['d'] || G.keys['arrowright']) { ax += Math.cos(rad); ay += Math.sin(rad); }

        const mg = Math.sqrt(ax * ax + ay * ay);
        if (mg > 1) { ax /= mg; ay /= mg; }

        const f = (dt / 16) * spd;
        MV.vx = MV.vx * MV.friction + ax * f;
        MV.vy = MV.vy * MV.friction + ay * f;

        if (Math.abs(MV.vx) + Math.abs(MV.vy) > 1e-7) {
            G.pos.lng += MV.vx;
            G.pos.lat += MV.vy;
            
            // Update marker
            G.marker.setLngLat([G.pos.lng, G.pos.lat]);
            
            // Camera follow (top-down GTA style)
            G.map.easeTo({
                center: [G.pos.lng, G.pos.lat],
                bearing: G.heading,
                duration: 100,
                easing: t => t
            });

            // Update minimap
            G.minimap.setCenter([G.pos.lng, G.pos.lat]);

            // Speed calculation
            const dist = Math.sqrt(MV.vx * MV.vx + MV.vy * MV.vy);
            G.speed = Math.round(dist * 111000 * 3600 / 16);
        } else {
            G.speed = 0;
        }
    }

    function moveVehicle(dt) {
        const accel = 0.000004;
        const maxSpeed = MV.vehicle * 1.5;
        const steerRate = 3.0 * (dt / 16);

        // Throttle
        if (G.keys['w']) {
            MV.vx -= Math.sin((G.heading * Math.PI) / 180) * accel * dt;
            MV.vy += Math.cos((G.heading * Math.PI) / 180) * accel * dt;
        }
        if (G.keys['s']) {
            MV.vx += Math.sin((G.heading * Math.PI) / 180) * accel * 0.7 * dt;
            MV.vy -= Math.cos((G.heading * Math.PI) / 180) * accel * 0.7 * dt;
        }

        // Steering
        const speed = Math.sqrt(MV.vx * MV.vx + MV.vy * MV.vy);
        if (speed > 0.000001) {
            if (G.keys['a']) G.heading -= steerRate * Math.min(1, speed * 8000);
            if (G.keys['d']) G.heading += steerRate * Math.min(1, speed * 8000);
        }

        // Friction
        MV.vx *= 0.995;
        MV.vy *= 0.995;

        // Cap speed
        const sp = Math.sqrt(MV.vx * MV.vx + MV.vy * MV.vy);
        if (sp > maxSpeed) {
            MV.vx = (MV.vx / sp) * maxSpeed;
            MV.vy = (MV.vy / sp) * maxSpeed;
        }

        if (Math.abs(MV.vx) + Math.abs(MV.vy) > 1e-7) {
            G.pos.lng += MV.vx;
            G.pos.lat += MV.vy;
            G.marker.setLngLat([G.pos.lng, G.pos.lat]);
            G.map.easeTo({ center: [G.pos.lng, G.pos.lat], bearing: G.heading, pitch: 70, duration: 100 });
            G.minimap.setCenter([G.pos.lng, G.pos.lat]);
            G.speed = Math.round(Math.sqrt(MV.vx * MV.vx + MV.vy * MV.vy) * 111000 * 3600 / 16);
        } else {
            G.speed = 0;
        }
    }

    // ─── COMBAT SYSTEM ────────────────────────────────────────────
    function toggleVehicle() {
        G.vehicleMode = !G.vehicleMode;
        toast(G.vehicleMode ? '🚗 Vehicle Mode' : '🚶 On Foot');
    }

    function shoot() {
        const gs = G.guns[G.gun];
        const ammo = G.ammo[G.gun];
        
        if (ammo.mag <= 0) {
            startReload();
            return;
        }
        
        ammo.mag--;
        
        // Get mouse position (simplified: shoot in front)
        const rad = (G.heading * Math.PI) / 180;
        const targetLng = G.pos.lng + Math.sin(rad) * 0.0005;
        const targetLat = G.pos.lat + Math.cos(rad) * 0.0005;
        
        shootAt(targetLng, targetLat);
        updateHUD();
    }

    function shootAt(lng, lat, isHeadshot = false) {
        const gs = G.guns[G.gun];
        const ammo = G.ammo[G.gun];
        
        if (G.screen !== 'game') return;
        if (ammo.mag <= 0) { startReload(); return; }
        
        ammo.mag--;
        
        // Visual feedback
        const from = G.map.project([G.pos.lng, G.pos.lat]);
        const to = G.map.project([lng, lat]);
        drawTrail(from.x, from.y, to.x, to.y);
        drawMuzzle(from.x, from.y);
        
        // Hit detection
        G.pedestrians.forEach(p => {
            const d = distM(p.lng, p.lat, lng, lat);
            if (d < (gs.range / 3)) {
                const dmg = isHeadshot ? gs.damage * gs.headshot : gs.damage;
                p.hp -= dmg;
                if (p.hp <= 0) {
                    G.kills++;
                    addMoney(500);
                    toast('💀 Target eliminated!');
                    // Respawn
                    p.hp = 100;
                    p.lng = G.pos.lng + (Math.random() - 0.5) * 0.01;
                    p.lat = G.pos.lat + (Math.random() - 0.5) * 0.01;
                }
            }
        });
        
        updateHUD();
        playSound('gun');
    }

    function startReload() {
        const gs = G.guns[G.gun];
        const ammo = G.ammo[G.gun];
        
        if (ammo.reserve <= 0) {
            toast('OUT OF AMMO', 'warn');
            return;
        }
        
        toast('RELOADING...');
        
        setTimeout(() => {
            const need = gs.mag - ammo.mag;
            const take = Math.min(need, ammo.reserve);
            ammo.mag += take;
            ammo.reserve -= take;
            updateHUD();
            toast(`${gs.icon} RELOADED`);
            playSound('reload');
        }, 1400);
    }

    function drawTrail(x1, y1, x2, y2) {
        const ctx = document.getElementById('gunlayer').getContext('2d');
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = 'rgba(255, 255, 160, 0.85)';
        ctx.lineWidth = 2;
        ctx.shadowColor = 'rgba(255, 255, 80, 0.8)';
        ctx.shadowBlur = 5;
        ctx.stroke();
        ctx.restore();
        
        setTimeout(() => {
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        }, 150);
    }

    function drawMuzzle(x, y) {
        const ctx = document.getElementById('gunlayer').getContext('2d');
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, 10, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 210, 40, 0.7)';
        ctx.shadowColor = 'rgba(255, 200, 0, 0.9)';
        ctx.shadowBlur = 20;
        ctx.fill();
        ctx.restore();
        
        setTimeout(() => {
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        }, 100);
    }

    // ─── WEAPON WHEEL ────────────────────────────────────────────
    function openWeaponWheel() {
        const wheel = document.getElementById('weaponwheel');
        const wheelEl = document.getElementById('wheel');
        wheel.classList.add('open');
        wheelEl.innerHTML = '';
        
        const n = G.guns.length;
        G.guns.forEach((g, i) => {
            const angle = (i / n) * 360 - 90;
            const r = 100;
            const x = 150 + Math.cos((angle * Math.PI) / 180) * r;
            const y = 150 + Math.sin((angle * Math.PI) / 180) * r;
            
            const slot = document.createElement('div');
            slot.className = `wslot ${G.gun === i ? 'active' : ''}`;
            slot.style.left = x + 'px';
            slot.style.top = y + 'px';
            slot.innerHTML = `<span>${g.icon}</span><small>${g.name.split(' ')[0]}</small>`;
            slot.onclick = () => { switchGun(i); closeWeaponWheel(); };
            wheelEl.appendChild(slot);
        });
    }

    function closeWeaponWheel() {
        document.getElementById('weaponwheel').classList.remove('open');
    }

    function switchGun(index) {
        G.gun = index;
        updateHUD();
        toast(`${G.guns[index].icon} ${G.guns[index].name}`);
    }

    // ─── HUD UPDATES ─────────────────────────────────────────────
    function updateHUD() {
        // Money
        document.getElementById('moneyd').textContent = '$' + G.money.toLocaleString();
        
        // Wanted stars
        for (let i = 1; i <= 5; i++) {
            const s = document.getElementById('s' + i);
            s.classList.toggle('lit', i <= G.wanted);
        }
        
        // Health / Armor
        document.getElementById('hpbar').style.width = G.health + '%';
        document.getElementById('arbar').style.width = G.armor + '%';
        
        // Ammo
        const gs = G.guns[G.gun];
        const ammo = G.ammo[G.gun];
        // (Optional: add ammo display)
    }

    function addMoney(n) {
        G.money += n;
        updateHUD();
    }

    function updateStars() {
        for (let i = 1; i <= 5; i++) {
            const s = document.getElementById('s' + i);
            s.classList.toggle('lit', i <= G.wanted);
        }
    }

    // ─── MISSION SYSTEM ──────────────────────────────────────────
    function openOverlay(type) {
        const overlay = document.getElementById('overlay');
        const title = document.getElementById('modal-title');
        const content = document.getElementById('modal-content');
        
        overlay.classList.add('open');
        
        if (type === 'missions') {
            title.textContent = '📋 MISSIONS';
            content.innerHTML = MISSIONS.map(m => `
                <div class="mission-item" data-id="${m.id}">
                    <div class="mission-icon">${m.icon}</div>
                    <div class="mission-info">
                        <div class="mission-name">${m.name}</div>
                        <div class="mission-desc">${m.desc}</div>
                        <div class="mission-reward">+$${m.reward.toLocaleString()}</div>
                    </div>
                    <div class="mission-status">START</div>
                </div>
            `).join('');
            
            content.querySelectorAll('.mission-item').forEach(item => {
                item.onclick = () => {
                    const m = MISSIONS.find(x => x.id === item.dataset.id);
                    startMission(m);
                    overlay.classList.remove('open');
                };
            });
        } else if (type === 'leaderboard') {
            title.textContent = '🏆 LEADERBOARD';
            const players = [
                { name: G.name, score: G.money, kills: G.kills },
                ...BOT_NAMES.slice(0, 8).map(n => ({ name: n, score: Math.floor(Math.random() * 20000), kills: Math.floor(Math.random() * 50) }))
            ].sort((a, b) => b.score - a.score);
            
            content.innerHTML = players.map((p, i) => `
                <div class="lb-row">
                    <div class="lb-rank">#${i + 1}</div>
                    <div class="lb-name">${p.name} ${p.name === G.name ? '(You)' : ''}</div>
                    <div class="lb-score">$${p.score.toLocaleString()}</div>
                    <div class="lb-kills">${p.kills} 💀</div>
                </div>
            `).join('');
        }
    }

    document.getElementById('modal-close').onclick = () => {
        document.getElementById('overlay').classList.remove('open');
    };

    function startMission(m) {
        G.activeMission = m;
        G.activeStage = 0;
        runStage(m.stages[0]);
        toast(`📋 MISSION: ${m.name}`, 'gold');
    }

    function runStage(stage) {
        if (!stage) return;
        
        document.getElementById('missionh').classList.add('on');
        document.getElementById('mname').textContent = G.activeMission.name;
        document.getElementById('mobjective').textContent = stage.obj;
        document.getElementById('mprogi').style.width = '0%';
        
        if (stage.goal === 'waypoint') {
            // Generate a random waypoint near player
            const angle = Math.random() * Math.PI * 2;
            const dist = 0.005 + Math.random() * 0.01;
            const targetLng = G.pos.lng + Math.cos(angle) * dist;
            const targetLat = G.pos.lat + Math.sin(angle) * dist;
            
            setWaypoint(targetLng, targetLat, stage.obj);
            
            // Check if reached
            const checkInterval = setInterval(() => {
                const d = distM(G.pos.lng, G.pos.lat, targetLng, targetLat);
                if (d < (stage.radius || 50)) {
                    clearInterval(checkInterval);
                    nextStage();
                }
            }, 500);
        }
        
        if (stage.goal === 'hold') {
            let held = 0;
            const interval = setInterval(() => {
                held++;
                const pct = (held / stage.target) * 100;
                document.getElementById('mprogi').style.width = pct + '%';
                if (held >= stage.target) {
                    clearInterval(interval);
                    nextStage();
                }
            }, 1000);
        }
    }

    function setWaypoint(lng, lat, label) {
        G.missionWaypoint = { lng, lat };
        
        if (G.waypointMarker) G.waypointMarker.remove();
        
        const el = document.createElement('div');
        el.className = 'cpmarkwrap';
        el.innerHTML = `<div class="cpmarkdot"></div><div class="cpmarkring"></div>`;
        
        G.waypointMarker = new maplibregl.Marker({ element: el, anchor: 'center' })
            .setLngLat([lng, lat])
            .addTo(G.map);
        
        // Draw GPS line
        drawGPSLine(lng, lat);
    }

    function drawGPSLine(lng, lat) {
        if (!G.map.getSource('gpsline')) {
            G.map.addSource('gpsline', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } } });
            G.map.addLayer({
                id: 'gpsline',
                type: 'line',
                source: 'gpsline',
                paint: { 'line-color': '#ffb830', 'line-width': 3, 'line-dasharray': [2, 2], 'line-opacity': 0.8 }
            });
        }
        
        G.map.getSource('gpsline').setData({
            type: 'Feature',
            geometry: { type: 'LineString', coordinates: [[G.pos.lng, G.pos.lat], [lng, lat]] }
        });
    }

    function nextStage() {
        G.activeStage++;
        const m = G.activeMission;
        if (!m || !m.stages || G.activeStage >= m.stages.length) {
            completeMission(m);
            return;
        }
        runStage(m.stages[G.activeStage]);
    }

    function completeMission(m) {
        addMoney(m.reward);
        toast(`✅ MISSION COMPLETE: ${m.name} +$${m.reward.toLocaleString()}`, 'gold');
        document.getElementById('missionh').classList.remove('on');
        if (G.waypointMarker) G.waypointMarker.remove();
        if (G.map.getLayer('gpsline')) G.map.removeLayer('gpsline');
        G.activeMission = null;
        playSound('claim');
    }

    function checkMissionProgress() {
        // (Optional: continuously check mission goals like kills)
    }

    // ─── CONTROLS ────────────────────────────────────────────────
    function bindControls() {
        document.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            G.keys[k] = true;
            
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key)) e.preventDefault();
            
            if (k === 'v') toggleVehicle();
            if (k === 'g') openWeaponWheel();
            if (k === 'r') startReload();
            if (k === 'escape') {
                if (document.getElementById('weaponwheel').classList.contains('open')) {
                    closeWeaponWheel();
                } else {
                    G.screen = 'menu';
                    document.getElementById('menu').classList.remove('gone');
                }
            }
            if (['1', '2', '3', '4', '5'].includes(k)) switchGun(parseInt(k) - 1);
        });
        
        document.addEventListener('keyup', (e) => {
            G.keys[e.key.toLowerCase()] = false;
        });
    }

    // ─── AUDIO ───────────────────────────────────────────────────
    function initAudio() {
        try {
            G.aCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) {}
    }

    function playSound(type) {
        if (!G.aCtx) return;
        const now = G.aCtx.currentTime;
        
        if (type === 'gun') {
            const buf = G.aCtx.createBuffer(1, G.aCtx.sampleRate * 0.12, G.aCtx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
            const src = G.aCtx.createBufferSource();
            src.buffer = buf;
            const g = G.aCtx.createGain();
            g.gain.setValueAtTime(0.5, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            src.connect(g).connect(G.aCtx.destination);
            src.start();
        }
        
        if (type === 'reload') {
            [180, 120].forEach((f, i) => {
                const o = G.aCtx.createOscillator();
                o.type = 'square';
                o.frequency.setValueAtTime(f, now + i * 0.1);
                const g = G.aCtx.createGain();
                g.gain.setValueAtTime(0.15, now + i * 0.1);
                g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.08);
                o.connect(g).connect(G.aCtx.destination);
                o.start(now + i * 0.1);
                o.stop(now + i * 0.1 + 0.1);
            });
        }
    }

    // ─── UTILITIES ───────────────────────────────────────────────
    function distM(lng1, lat1, lng2, lat2) {
        const R = 6371000;
        const p1 = lat1 * Math.PI / 180;
        const p2 = lat2 * Math.PI / 180;
        const dp = (lat2 - lat1) * Math.PI / 180;
        const dl = (lng2 - lng1) * Math.PI / 180;
        const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function toast(msg, type = '') {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'on';
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove('on'), 3000);
    }

    function updateClock() {
        const now = new Date();
        // (Optional: display time)
    }

    function cycleCharacter() {
        const keys = Object.keys(CHARACTERS);
        const idx = keys.indexOf(G.char);
        G.char = keys[(idx + 1) % keys.length];
        document.getElementById('char-pick-btn').textContent = CHARACTERS[G.char].emoji;
        toast(`Character: ${G.char.toUpperCase()}`);
    }

    // ─── BOOT ────────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', init);

    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
    }
    </script>
