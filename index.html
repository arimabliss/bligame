<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#1a1a1a"/>
<title>OPEN WORLD — GTA 1 Edition</title>
<link rel="manifest" href="manifest.json"/>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet"/>
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
:root{
  --g:#39ff6a;--gd:#1a7a35;--a:#ffb830;--r:#ff3b3b;--b:#4fc3f7;
  --p:#c084fc;--pk:#f472b6;--bg:#0a0a0a;--pn:rgba(10,10,10,.92);
  --br:rgba(57,255,106,.22);--tx:#d0d0d0;--dm:#6a6a6a;
  --fh:'Rajdhani',sans-serif;--fm:'Share Tech Mono',monospace;--fp:'Press Start 2P',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--fh);color:var(--tx);-webkit-tap-highlight-color:transparent;user-select:none;}

/* MAP + CANVAS GAME LAYER */
#map{position:fixed;inset:0;filter:saturate(.65) contrast(1.08) brightness(.92);}
#gameCanvas{position:fixed;inset:0;pointer-events:none;z-index:5;image-rendering:pixelated;image-rendering:crisp-edges;}
#scanlines{position:fixed;inset:0;pointer-events:none;z-index:8;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.025) 2px,rgba(0,0,0,.025) 4px);}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55) 100%);}

/* HUD — compact GTA1 style */
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;display:flex;flex-direction:column;font-family:var(--fm);}
#topbar{pointer-events:all;display:flex;align-items:center;gap:6px;padding:8px 10px 4px;background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent);}
#logo .t{font-family:var(--fp);font-size:11px;letter-spacing:.1em;color:var(--g);text-shadow:0 0 8px var(--g);}
#logo .s{font-size:7px;color:var(--dm);letter-spacing:.15em;}
#sw{flex:1;position:relative;max-width:280px;}
#sw input{width:100%;background:var(--pn);border:1px solid var(--br);border-radius:3px;padding:6px 6px 6px 24px;color:var(--tx);font-family:var(--fm);font-size:11px;outline:none;}
#sw input:focus{border-color:var(--g);}
#sw-icon{position:absolute;left:7px;top:50%;transform:translateY(-50%);color:var(--gd);font-size:10px;pointer-events:none;}
#sres{position:absolute;top:calc(100% + 4px);left:0;right:0;background:rgba(5,5,5,.98);border:1px solid var(--br);border-radius:3px;display:none;z-index:100;max-height:200px;overflow-y:auto;}
#sres.open{display:block;}
.sri{padding:7px 9px;font-size:11px;cursor:pointer;border-bottom:1px solid rgba(57,255,106,.06);line-height:1.4;}
.sri:hover{background:rgba(57,255,106,.08);color:var(--g);}
.sri .sn{font-weight:600;font-size:11px;}.sri .ss{font-size:9px;color:var(--dm);}

.hb{pointer-events:all;background:var(--pn);border:1px solid var(--br);border-radius:3px;color:var(--dm);width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;transition:all .15s;flex-shrink:0;}
.hb:hover,.hb.on{border-color:var(--g);color:var(--g);box-shadow:0 0 7px rgba(57,255,106,.2);}
.hb.on{background:rgba(57,255,106,.06);}
.hb.rb{color:var(--r)!important;border-color:rgba(255,59,59,.3)!important;}

/* BOTTOM */
#botbar{margin-top:auto;padding:6px 10px 12px;display:flex;align-items:flex-end;justify-content:space-between;background:linear-gradient(to top,rgba(0,0,0,.82),transparent);pointer-events:none;}
#rw{pointer-events:all;position:relative;width:110px;height:110px;flex-shrink:0;}
#rborder{position:absolute;inset:0;border-radius:50%;border:2px solid var(--g);z-index:2;pointer-events:none;box-shadow:0 0 12px rgba(57,255,106,.25),inset 0 0 12px rgba(0,0,0,.5);}
#rborder::before{content:'';position:absolute;inset:4px;border-radius:50%;border:1px solid rgba(57,255,106,.1);}
#minimap{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#050a05;}
#rcenter{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;background:var(--g);border-radius:50%;box-shadow:0 0 6px var(--g);z-index:4;pointer-events:none;}
#rcompass{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--g);letter-spacing:.06em;}

/* RIGHT HUD */
#gtar{position:fixed;bottom:130px;right:10px;z-index:25;pointer-events:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
#moneyd{font-family:var(--fp);font-size:14px;color:var(--g);text-shadow:0 0 8px var(--g);letter-spacing:.03em;}
#wantedw{display:flex;gap:2px;justify-content:flex-end;}
.star{width:12px;height:12px;font-size:9px;line-height:12px;text-align:center;color:#222;filter:grayscale(1);transition:all .2s;}
.star.lit{color:var(--a);text-shadow:0 0 5px var(--a);filter:none;}
#gundisplay{display:flex;align-items:center;gap:5px;font-size:8px;color:var(--a);}
#gunicon{font-size:13px;}
#gunammo{color:var(--dm);}
.barr{display:flex;align-items:center;gap:5px;}
.brl{font-size:7px;letter-spacing:.1em;color:var(--dm);width:22px;text-align:right;}
.bro{width:90px;height:6px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.05);border-radius:1px;overflow:hidden;}
.bri{height:100%;border-radius:1px;transition:width .3s;}
#hpbar{background:#ff4444;}#arbar{background:#4fc3f7;}

/* SPEED */
#spdo{position:fixed;bottom:128px;right:10px;z-index:25;text-align:right;pointer-events:none;display:none;}
#spdo.on{display:block;}
#spdv{font-family:var(--fp);font-size:20px;color:var(--g);text-shadow:0 0 10px var(--g);line-height:1;}
#spdu{font-size:7px;color:var(--dm);letter-spacing:.14em;}

/* TOAST + MISSION */
#toast{position:fixed;bottom:160px;left:50%;transform:translateX(-50%) translateY(15px);z-index:50;background:var(--pn);border:1px solid var(--br);border-radius:3px;padding:5px 12px;font-family:var(--fm);font-size:10px;color:var(--g);letter-spacing:.08em;opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.warn{color:var(--r);border-color:rgba(255,59,59,.3);}
#toast.gold{color:var(--a);border-color:rgba(255,184,48,.35);}

#missionh{position:fixed;top:50px;left:10px;z-index:25;pointer-events:none;display:none;max-width:220px;background:rgba(0,0,0,.7);border-left:2px solid var(--a);padding:6px 10px;}
#missionh.on{display:block;}
#mname{font-size:9px;color:var(--a);letter-spacing:.08em;}
#mobjective{font-size:7px;color:var(--dm);margin-top:2px;line-height:1.5;}
#mprog{display:flex;align-items:center;gap:5px;margin-top:4px;}
#mprogb{flex:1;height:2px;background:rgba(255,184,48,.1);border-radius:1px;overflow:hidden;}
#mprogi{height:100%;background:var(--a);width:0%;transition:width .4s;}
#mprogt{font-size:7px;color:var(--dm);}

/* INTERACTION PROMPT */
#prompt{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(0,0,0,.82);border:1px solid var(--g);border-radius:3px;padding:5px 14px;font-family:var(--fm);font-size:11px;color:var(--g);letter-spacing:.08em;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;}
#prompt.on{opacity:1;}

/* JOYSTICK */
#jzone{pointer-events:all;position:fixed;bottom:70px;left:14px;z-index:30;display:none;}
#jout{width:90px;height:90px;border-radius:50%;background:rgba(5,12,5,.45);border:2px solid rgba(57,255,106,.22);position:relative;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);touch-action:none;}
#jin{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(57,255,106,.45),rgba(57,255,106,.08));border:1.5px solid rgba(57,255,106,.45);position:absolute;}
#ractions{pointer-events:all;position:fixed;bottom:78px;right:14px;z-index:30;display:flex;flex-direction:column;gap:6px;}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
#ldlogo{font-family:var(--fp);font-size:20px;letter-spacing:.12em;color:var(--g);text-shadow:0 0 20px var(--g);}
#ldsub{font-family:var(--fm);font-size:8px;color:var(--dm);letter-spacing:.2em;}
#ldbw{width:180px;height:2px;background:rgba(57,255,106,.06);border-radius:1px;overflow:hidden;}
#ldb{height:100%;background:var(--g);box-shadow:0 0 6px var(--g);width:0%;transition:width .3s ease;}
#lds{font-family:var(--fm);font-size:8px;color:var(--gd);letter-spacing:.1em;}

/* MENU */
#menu{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 55%,rgba(57,255,106,.06) 0%,rgba(0,0,0,.96) 65%);}
#menu.gone{display:none;}
.mpanel{position:relative;z-index:2;width:min(400px,92vw);display:flex;flex-direction:column;align-items:center;}
.mtitle{font-family:var(--fp);font-size:clamp(22px,5vw,32px);letter-spacing:.15em;color:var(--g);text-shadow:0 0 28px var(--g),0 0 55px rgba(57,255,106,.2);line-height:1.2;text-align:center;}
.msub{font-family:var(--fm);font-size:7px;color:var(--dm);letter-spacing:.35em;margin:4px 0 20px;}
.mbtn{width:100%;padding:11px 16px;margin:3px 0;background:rgba(5,12,5,.75);border:1px solid var(--br);border-radius:3px;font-family:var(--fh);font-size:14px;font-weight:600;letter-spacing:.1em;color:var(--dm);cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;transition:all .18s;}
.mbtn:hover{border-color:var(--g);color:var(--g);box-shadow:0 0 14px rgba(57,255,106,.15);transform:translateX(4px);}
.mbtn .bi{font-size:16px;width:22px;text-align:center;}
#pname{width:100%;background:var(--pn);border:1px solid var(--br);border-radius:3px;padding:9px 12px;color:var(--tx);font-family:var(--fm);font-size:13px;font-weight:600;outline:none;margin-bottom:10px;}
#pname:focus{border-color:var(--g);}
#charpick{width:100%;padding:9px;margin-bottom:6px;background:var(--pn);border:1px solid var(--br);border-radius:3px;color:var(--p);font-family:var(--fh);font-size:12px;letter-spacing:.08em;cursor:pointer;transition:all .2s;text-align:center;}
#charpick:hover{border-color:var(--p);box-shadow:0 0 12px rgba(192,132,252,.2);}
#startbtn{width:100%;padding:13px;margin-top:10px;background:rgba(57,255,106,.1);border:2px solid var(--g);border-radius:3px;font-family:var(--fp);font-size:11px;font-weight:700;letter-spacing:.15em;color:var(--g);cursor:pointer;text-shadow:0 0 8px var(--g);transition:all .2s;}
#startbtn:hover{background:rgba(57,255,106,.2);box-shadow:0 0 22px rgba(57,255,106,.25);}

/* CHARACTER SELECT */
#charselect{position:fixed;inset:0;z-index:950;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.94);backdrop-filter:blur(10px);}
#charselect.open{display:flex;}
#cspanel{width:min(480px,94vw);background:var(--pn);border:1px solid var(--br);border-radius:6px;padding:20px;}
#cspanel h2{font-family:var(--fm);font-size:11px;letter-spacing:.18em;color:var(--g);margin-bottom:14px;text-align:center;}
.chars-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.charopt{padding:12px 6px;background:rgba(5,12,5,.8);border:1px solid var(--br);border-radius:4px;cursor:pointer;text-align:center;transition:all .2s;}
.charopt:hover,.charopt.sel{border-color:var(--p);box-shadow:0 0 12px rgba(192,132,252,.18);background:rgba(192,132,252,.05);}
.charopt .ce{font-size:30px;display:block;margin-bottom:6px;}
.charopt .cname{font-size:11px;font-weight:700;color:var(--p);letter-spacing:.06em;display:block;}
.charopt .cdesc{font-family:var(--fm);font-size:7px;color:var(--dm);margin-top:3px;line-height:1.4;}
#cs-confirm{width:100%;padding:10px;background:rgba(192,132,252,.1);border:2px solid var(--p);border-radius:3px;font-family:var(--fh);font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--p);cursor:pointer;transition:all .2s;}
#cs-confirm:hover{background:rgba(192,132,252,.2);}

/* MAPLIBRE CLEAN */
.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none!important;}
.maplibregl-canvas{outline:none;}
.maplibregl-ctrl-top-right,.maplibregl-ctrl-top-left,.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{display:none!important;}

@media(max-width:600px){#logo{display:none;}#rw{width:95px;height:95px;}#jzone{display:block;}#gtar{bottom:120px;}#spdo{bottom:118px;}}
@media(min-width:601px){#ractions{display:none;}}
</style>
</head>
<body>

<div id="loading">
  <div id="ldlogo">OPEN WORLD</div>
  <div id="ldsub">GTA 1 EDITION · REAL-WORLD CITY</div>
  <div id="ldbw"><div id="ldb"></div></div>
  <div id="lds">INITIALIZING...</div>
</div>

<div id="map"></div>
<canvas id="gameCanvas"></canvas>
<div id="scanlines"></div><div id="vignette"></div>

<!-- HUD -->
<div id="hud">
  <div id="topbar">
    <div id="logo"><div class="t">OPEN WORLD</div><div class="s">REAL-WORLD EDITION</div></div>

    <button class="hb" id="bmenu" title="Menu">☰</button>
    <button class="hb" id="bmis" title="Missions">📋</button>
    <button class="hb" id="bveh" title="Enter/Exit Vehicle [E]">🚗</button>

    <div id="rw"><div id="minimap"></div><div id="rborder"></div><div id="rcenter"></div><div id="rcompass">N</div></div>
  </div>
</div>

<div id="gtar">
  <div id="moneyd">$0</div>
  <div id="wantedw"><span class="star" id="s1">★</span><span class="star" id="s2">★</span><span class="star" id="s3">★</span><span class="star" id="s4">★</span><span class="star" id="s5">★</span></div>
  <div id="gundisplay"><span id="gunicon">🔫</span><span id="gunname">PISTOL</span><span id="gunammo">∞</span></div>
  <div class="barr"><span class="brl">HP</span><div class="bro"><div class="bri" id="hpbar" style="width:100%"></div></div></div>

</div>

<div id="missionh"><div id="mname">MISSION</div><div id="mobjective"></div><div id="mprog"><div id="mprogb"><div id="mprogi"></div></div><span id="mprogt">0%</span></div></div>
<div id="prompt"></div>
<div id="toast"></div>

<!-- JOYSTICK -->
<div id="jzone"><div id="jout"><div id="jin"></div></div></div>
<div id="ractions">
  <button class="hb" id="mveh">🚗</button><button class="hb" id="mact">F</button><button class="hb" id="mshoot">🔫</button>
</div>

<!-- MENU -->
<div id="menu">
  <div class="mpanel">
    <div class="mtitle">OPEN WORLD</div>
    <div class="msub">GTA 1 EDITION · REAL-WORLD CITY</div>
    <input type="text" id="pname" placeholder="Your name..." maxlength="14" autocomplete="off"/>

    <button class="mbtn" id="mmlb"><span class="bi">🏆</span> LEADERBOARD</button>
    <button class="mbtn" id="mmhtp"><span class="bi">?</span> HOW TO PLAY</button>
  </div>
</div>

<!-- CHARACTER SELECT -->
<div id="charselect">
  <div id="cspanel">
    <h2>SELECT YOUR CHARACTER</h2>
    <div class="chars-grid" id="charsgrid"></div>
    <button id="cs-confirm">✓ CONFIRM</button>
  </div>
</div>

<!-- HTP -->
<div id="htpover" style="position:fixed;inset:0;z-index:960;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.94);backdrop-filter:blur(10px);">
  <div style="width:min(500px,94vw);background:var(--pn);border:1px solid var(--br);border-radius:6px;padding:18px;max-height:85vh;overflow-y:auto;">
    <h2 style="font-family:var(--fm);font-size:11px;letter-spacing:.16em;color:var(--g);margin-bottom:14px;">📖 HOW TO PLAY</h2>
    <div id="htpcontent"></div>
    <div style="font-family:var(--fm);font-size:8px;color:var(--dm);letter-spacing:.16em;cursor:pointer;text-align:center;padding:8px;margin-top:8px;" id="htpclose">← CLOSE</div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   OPEN WORLD — GTA 1 EDITION
   Real-world city · Top-down sprites · Driving · Police · Missions
   ═══════════════════════════════════════════════════════════════════ */

const STYLES={

};

];

const VEHICLE_TYPES=[
  {id:'hatch',name:'HATCHBACK',maxSpeed:110,accel:1.2,brake:2.5,steer:0.06,weight:1.0,color:'#e76f51',w:22,h:12},

function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function rnd(n){return Math.floor(Math.random()*n);}
function ls(k,v){if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}
function distM(lng1,lat1,lng2,lat2){const R=6371000,p1=lat1*Math.PI/180,p2=lat2*Math.PI/180,dp=(lat2-lat1)*Math.PI/180,dl=(lng2-lng1)*Math.PI/180,a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function ld(p,m){document.getElementById('ldb').style.width=p+'%';document.getElementById('lds').textContent=m;}
let _tT;
function toast(msg,type=''){const el=document.getElementById('toast');el.textContent=msg;el.className='on'+(type?' '+type:'');clearTimeout(_tT);_tT=setTimeout(()=>el.classList.remove('on'),2800);}
function showPrompt(msg){const el=document.getElementById('prompt');if(msg){el.textContent=msg;el.classList.add('on');}else el.classList.remove('on');}

const SAVE_KEY='owSave_v5';
function saveGame(){
  try{
    const data={version:5,name:G.name,char:G.char.id,money:G.money,health:G.health,armor:G.armor,
      missions:[...G.missionsDone],kills:G.kills,terrArea:G.terr.totalArea,
      ownedVehicles:G.vehicles.filter(v=>v.owned).map(v=>v.type),savedAt:Date.now()};
    ls(SAVE_KEY,JSON.stringify(data));

function loadGame(){
  try{
    const raw=ls(SAVE_KEY); if(!raw) return;

    if(!d||d.version!==5) return;
    G.name=d.name||G.name; G.money=d.money||0; G.health=d.health||100; G.armor=d.armor||75;
    G.kills=d.kills||0; G.terr.totalArea=d.terrArea||0;
    if(d.char){const c=CHARACTERS.find(x=>x.id===d.char);if(c)G.char=c;}

}

/* ═══════════════════════════════════════════════════════════════════
   ROAD GRAPH (real map geometry)
═══════════════════════════════════════════════════════════════════ */
function buildRoadGraph(){
  try{
    const feats=G.map.queryRenderedFeatures({layers:['road']});
    if(!feats.length){
      // Fallback: query source features
      const src=G.map.getSource('composite');
      if(src)G.roadGraph={segments:[],nodes:[]};
      return;
    }
    const segments=[],nodes=[];
    feats.forEach(f=>{
      if(f.geometry.type==='LineString'){
        const coords=f.geometry.coordinates;
        for(let i=0;i<coords.length-1;i++){
          segments.push({a:coords[i],b:coords[i+1]});
          nodes.push(coords[i]);
        }
      }
    });
    G.roadGraph={segments,nodes};
  }catch(e){G.roadGraph={segments:[],nodes:[]};}
}

function nearestRoadPoint(lng,lat){
  if(!G.roadGraph||!G.roadGraph.segments.length)return{lng,lat,heading:0};
  let best=null,bestD=Infinity;
  G.roadGraph.segments.forEach(s=>{
    const d=distM(lng,lat,s.a[0],s.a[1]);
    if(d<bestD){bestD=d;best=s;}
  });
  if(!best)return{lng,lat,heading:0};
  const h=Math.atan2(best.b[1]-best.a[1],best.b[0]-best.a[0])*180/Math.PI;
  return{lng:best.a[0],lat:best.a[1],heading:h};
}

function spawnPlayer(){
  // Snap to nearest road
  const rp=nearestRoadPoint(G.pos.lng,G.pos.lat);
  G.pos.lng=rp.lng;G.pos.lat=rp.lat;
  G.heading=rp.heading||0;
}

function drawPlayer(){
  const s=worldToScreen(G.pos.lng,G.pos.lat);
  const ctx=G.ctx;
  const scale=G.vehicleMode?1.4:1.0;
  const size=10*scale;
  ctx.save();
  ctx.translate(s.x,s.y);
  ctx.rotate(G.heading*Math.PI/180);
  // Shadow
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath();ctx.ellipse(0,2,size*.6,size*.3,0,0,Math.PI*2);ctx.fill();
  // Body
  ctx.fillStyle=G.color;
  ctx.fillRect(-size/2,-size/2,size,size);
  // Direction indicator (head)
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(0,-size*.6,size*.25,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

      lng:rp.lng,lat:rp.lat,heading:rp.heading,speed:0,owned:false,hp:100,
      isPlayer:false,isPolice:false,
    });

function enterVehicle(v){
  if(G.vehicleMode){
    // Exit
    G.vehicleMode=false;
    G.vehicles=G.vehicles.filter(x=>x!==v);
    v.isPlayer=false;
    G.vehicles.push(v);
    document.getElementById('spdo').classList.remove('on');
    document.getElementById('bveh').classList.remove('on');
    showPrompt(null);
    return;
  }
  if(!v||v.distance>30)return;
  G.vehicleMode=true;v.isPlayer=true;
  G.playerVehicle=v;
  G.vehicles=G.vehicles.filter(x=>x!==v);
  document.getElementById('spdo').classList.add('on');
  document.getElementById('bveh').classList.add('on');
  showPrompt(null);
  toast('🚗 ENTERED '+v.name);
}

function updateVehiclePhysics(dt){
  if(!G.vehicleMode||!G.playerVehicle)return;
  const v=G.playerVehicle;
  const accel=G.keys['w']?v.accel*(dt/16):0;
  const brake=G.keys['s']?v.brake*(dt/16):0;
  const steerL=G.keys['a']?-v.steer*(dt/16):0;
  const steerR=G.keys['d']?v.steer*(dt/16):0;
  v.speed=Math.max(-v.maxSpeed/3,Math.min(v.maxSpeed,v.speed+accel-brake));
  v.speed*=0.98; // drag
  v.heading+=(steerL+steerR)*(v.speed/Math.max(1,v.maxSpeed))*2;
  const rad=v.heading*Math.PI/180;
  const move=v.speed*0.000012*(dt/16);
  const newLng=v.lng+Math.cos(rad)*move;
  const newLat=v.lat+Math.sin(rad)*move;
  // Building collision (simplified)
  if(!isInsideBuilding(newLng,newLat)){
    v.lng=newLng;v.lat=newLat;
  }else{
    v.speed*=-0.3; // bounce
  }
  G.pos.lng=v.lng;G.pos.lat=v.lat;
  G.speed=Math.round(Math.abs(v.speed));
  G.heading=v.heading;
  document.getElementById('spdv').textContent=Math.round(Math.abs(v.speed)*1.2);
  // Camera zoom out
  G.cameraZoom=15.5;
}

function isInsideBuilding(lng,lat){
  try{
    const feats=G.map.queryRenderedFeatures(G.map.project([lng,lat]),{layers:['building']});
    return feats.length>0;
  }catch(e){return false;}
}

function updateWanted(){
  // Decay wanted if no police nearby and timer elapsed
  if(G.wanted>0&&!G.police.some(p=>distM(p.lng,p.lat,G.pos.lng,G.pos.lat)<200)){
    clearTimeout(G.wantedDecay);
    G.wantedDecay=setTimeout(()=>{
      if(G.wanted>0){G.wanted--;updateStars();}
    },15000);
  }
  // Spawn police based on wanted
  if(G.wanted>=2&&G.police.length<G.wanted*2){
    spawnPolice(1);
  }
}

function updateStars(){
  for(let i=1;i<=5;i++){
    const s=document.getElementById('s'+i);
    s.classList.toggle('lit',i<=G.wanted);
  }
}

function increaseWanted(){
  if(G.wanted>=5)return;
  G.wanted++;updateStars();
  if(G.wanted>=2)toast('⚠️ WANTED: '+'★'.repeat(G.wanted),'warn');
  spawnPolice(Math.min(2,G.wanted));
}

/* ═══════════════════════════════════════════════════════════════════
   GAME LOOP (single RAF)
═══════════════════════════════════════════════════════════════════ */
function loop(ts){
  const dt=Math.min(ts-G.lastFrame,50);G.lastFrame=ts;
  if(G.screen==='game'){
    update(dt);
    render();
  }
  requestAnimationFrame(loop);
}

function update(dt){
  // Player movement (on foot)
  if(!G.vehicleMode){
    const spd=G.sprintMode?MV.sprint:MV.foot;
    const rad=G.heading*Math.PI/180;
    let ax=0,ay=0;
    if(G.keys['w']||G.keys['arrowup']){ax-=Math.sin(rad);ay+=Math.cos(rad);}
    if(G.keys['s']||G.keys['arrowdown']){ax+=Math.sin(rad);ay-=Math.cos(rad);}
    if(G.keys['a']||G.keys['arrowleft']){ax-=Math.cos(rad);ay-=Math.sin(rad);}
    if(G.keys['d']||G.keys['arrowright']){ax+=Math.cos(rad);ay+=Math.sin(rad);}
    if(G.joy.active){ax+=G.joy.dx*Math.cos(rad)-G.joy.dy*Math.sin(rad);ay+=G.joy.dx*Math.sin(rad)+G.joy.dy*Math.cos(rad);}
    const mg=Math.sqrt(ax*ax+ay*ay);if(mg>1){ax/=mg;ay/=mg;}
    const f=(dt/16)*spd;
    MV.vx=MV.vx*MV.fric+ax*f;MV.vy=MV.vy*MV.fric+ay*f;
    if(Math.abs(MV.vx)+Math.abs(MV.vy)>1e-8){
      const newLng=G.pos.lng+MV.vx,newLat=G.pos.lat+MV.vy;
      if(!isInsideBuilding(newLng,newLat)){
        G.pos.lng=newLng;G.pos.lat=newLat;
        G.heading=Math.atan2(MV.vy,MV.vx)*180/Math.PI;
      }else{MV.vx*=-0.3;MV.vy*=-0.3;}
    }
    // Camera zoom in
    G.cameraZoom=17;
  }

  // Vehicle physics
  if(G.vehicleMode)updateVehiclePhysics(dt);

  // Camera follow
  G.map.easeTo({center:[G.pos.lng,G.pos.lat],zoom:G.cameraZoom,duration:0});
  if(G.minimap)G.minimap.setCenter([G.pos.lng,G.pos.lat]);

  // Update entities
  updatePedestrians(dt);
  updateTraffic(dt);
  updatePolice(dt);
  updateWanted();
  updateInteraction();
  updateMission();
  updateTime(dt);
}

function updatePedestrians(dt){
  G.pedestrians.forEach(p=>{
    p.stateTimer-=dt;
    if(p.stateTimer<=0){p.stateTimer=2000+Math.random()*3000;p.heading+=(Math.random()-.5)*60;}
    const rad=p.heading*Math.PI/180;
    p.lng+=Math.cos(rad)*p.speed*(dt/16);
    p.lat+=Math.sin(rad)*p.speed*(dt/16);
  });
}

function updateTraffic(dt){
  G.traffic.forEach(t=>{
    const rad=t.heading*Math.PI/180;
    t.lng+=Math.cos(rad)*t.speed*(dt/16);
    t.lat+=Math.sin(rad)*t.speed*(dt/16);
    // Random turns
    if(Math.random()<.002)t.heading+=(Math.random()>.5?90:-90);
  });
}

function updatePolice(dt){
  G.police.forEach(p=>{
    const d=distM(p.lng,p.lat,G.pos.lng,G.pos.lat);
    if(d<150){
      p.lastSeen={lng:G.pos.lng,lat:G.pos.lat};
      // Move toward player
      const ang=Math.atan2(G.pos.lat-p.lat,G.pos.lng-p.lng);
      p.lng+=Math.cos(ang)*p.speed*(dt/16);
      p.lat+=Math.sin(ang)*p.speed*(dt/16);
      p.heading=ang*180/Math.PI;
      // Damage player if close
      if(d<25)takeDamage(0.1,'police');
    }else if(p.lastSeen){
      // Search last known position
      const ang=Math.atan2(p.lastSeen.lat-p.lat,p.lastSeen.lng-p.lng);
      p.lng+=Math.cos(ang)*p.speed*0.5*(dt/16);
      p.lat+=Math.sin(ang)*p.speed*0.5*(dt/16);
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════
   INTERACTION
═══════════════════════════════════════════════════════════════════ */
function updateInteraction(){
  G.nearbyVehicle=null;
  let closest=null,closestD=40;
  G.vehicles.forEach(v=>{
    if(v.isPlayer)return;
    const d=distM(G.pos.lng,G.pos.lat,v.lng,v.lat);
    if(d<closestD){closestD=d;closest=v;}
  });
  if(closest){
    G.nearbyVehicle=closest;
    if(!G.vehicleMode)showPrompt('[E] ENTER '+closest.name);
  }else if(!G.vehicleMode)showPrompt(null);
}

/* ═══════════════════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════════════════ */
function render(){
  const ctx=G.ctx;
  ctx.clearRect(0,0,G.cw,G.ch);
  // Draw pedestrians
  G.pedestrians.forEach(p=>drawSprite(worldToScreen(p.lng,p.lat),p.heading,8,p.color,'ped'));
  // Draw traffic
  G.traffic.forEach(t=>drawSprite(worldToScreen(t.lng,t.lat),t.heading,t.w,t.color,'car'));
  // Draw vehicles
  G.vehicles.forEach(v=>drawSprite(worldToScreen(v.lng,v.lat),v.heading,v.w,v.color,'car'));
  // Draw police
  G.police.forEach(p=>drawSprite(worldToScreen(p.lng,p.lat),p.heading,26,'#1d3557','car'));
  // Draw player (on foot or vehicle)
  if(G.vehicleMode&&G.playerVehicle){
    const v=G.playerVehicle;
    drawSprite(worldToScreen(v.lng,v.lat),v.heading,v.w,v.color,'car');
  }else{
    drawPlayer();
  }
}

function drawSprite(screen,heading,size,color,type){
  const ctx=G.ctx;
  ctx.save();
  ctx.translate(screen.x,screen.y);
  ctx.rotate(heading*Math.PI/180);
  if(type==='car'){
    // Shadow
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();ctx.ellipse(0,2,size*.55,size*.3,0,0,Math.PI*2);ctx.fill();
    // Body
    ctx.fillStyle=color;
    ctx.fillRect(-size/2,-size/2.5,size,size/1.25);
    // Windshield
    ctx.fillStyle='rgba(100,200,255,.5)';
    ctx.fillRect(size*.1,-size/3,size*.25,size/1.5);
    // Roof
    ctx.fillStyle='rgba(255,255,255,.2)';
    ctx.fillRect(-size*.2,-size/3,size*.25,size/1.5);
  }else{
    // Pedestrian
    ctx.fillStyle='rgba(0,0,0,.25)';
    ctx.beginPath();ctx.ellipse(0,1,size*.4,size*.2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=color;
    ctx.fillRect(-size/2,-size/2,size,size);
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(0,-size*.6,size*.25,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════
   DAMAGE / HEALTH
═══════════════════════════════════════════════════════════════════ */
function takeDamage(n,src){
  if(G.armor>0){G.armor=Math.max(0,G.armor-n);document.getElementById('arbar').style.width=G.armor+'%';return;}
  G.health=Math.max(0,G.health-n);
  document.getElementById('hpbar').style.width=G.health+'%';
  document.getElementById('hpbar').style.background=G.health<30?'#f00':'#ff4444';
  if(G.health<=0){toast('💀 WASTED — Respawning...','warn');setTimeout(()=>{G.health=100;G.armor=50;G.pos={lng:-74.006,lat:40.7128};G.wanted=0;updateStars();},2500);}
}

/* ═══════════════════════════════════════════════════════════════════
   MISSIONS
═══════════════════════════════════════════════════════════════════ */
function startMission(m){
  G.activeMission=m;
  document.getElementById('mname').textContent=m.icon+' '+m.name;
  document.getElementById('mobjective').textContent=m.desc;
  document.getElementById('mprogi').style.width='0%';
  document.getElementById('mprogt').textContent='0%';
  document.getElementById('missionh').classList.add('on');
  toast('📋 MISSION: '+m.name,'gold');
}

function updateMission(){
  const m=G.activeMission;if(!m)return;
  let prog=0;
  if(m.goal==='steal'&&G.vehicleMode)prog=100;
  if(m.goal==='speed'&&G.speed>=100)prog=100;
  if(m.goal==='kills')prog=Math.min(100,G.kills/3*100);
  if(m.goal==='territory')prog=Math.min(100,G.terr.totalArea/5000*100);
  if(m.goal==='money')prog=Math.min(100,G.money/5000*100);
  if(m.goal==='distance')prog=Math.min(100,G.stats?.totalDist/2000*100||0);
  document.getElementById('mprogi').style.width=prog+'%';
  document.getElementById('mprogt').textContent=Math.round(prog)+'%';
  if(prog>=100)completeMission(m);
}
function completeMission(m){
  G.missionsDone.add(m.id);
  ls('owMissions',JSON.stringify([...G.missionsDone]));
  G.money+=m.reward;
  document.getElementById('moneyd').textContent='$'+G.money.toLocaleString();
  document.getElementById('missionh').classList.remove('on');
  toast('✅ COMPLETE: '+m.name+' +$'+m.reward,'gold');
  G.activeMission=null;
}

/* ═══════════════════════════════════════════════════════════════════
   CONTROLS
═══════════════════════════════════════════════════════════════════ */
function bindControls(){
  document.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();G.keys[k]=true;
    if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key))e.preventDefault();
    if(e.key==='Shift')G.sprintMode=true;
    if(k==='e'&&G.nearbyVehicle)enterVehicle(G.nearbyVehicle);
    if(k==='g')switchGun();
    if(k==='m'){document.getElementById('miso')?.classList.add('open');}
    if(k==='n')toggleNight();
    if(k==='escape'&&G.screen==='game'){G.screen='menu';document.getElementById('menu').classList.remove('gone');}
    if(['1','2','3','4','5'].includes(k))switchGun(parseInt(k)-1);
  });
  document.addEventListener('keyup',e=>{G.keys[e.key.toLowerCase()]=false;if(e.key==='Shift')G.sprintMode=false;});

  // Mobile joystick
  const jo=document.getElementById('jout'),ji=document.getElementById('jin'),MR=30;
  let jX=0,jY=0;
  jo.addEventListener('touchstart',e=>{e.preventDefault();const r=jo.getBoundingClientRect();jX=r.left+r.width/2;jY=r.top+r.height/2;G.joy.active=true;},{passive:false});
  jo.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];let dx=t.clientX-jX,dy=t.clientY-jY,d=Math.sqrt(dx*dx+dy*dy);if(d>MR){dx=dx/d*MR;dy=dy/d*MR;}ji.style.transform=`translate(${dx}px,${dy}px)`;G.joy.dx=dx/MR;G.joy.dy=-dy/MR;},{passive:false});
  ['touchend','touchcancel'].forEach(ev=>jo.addEventListener(ev,()=>{ji.style.transform='translate(0,0)';G.joy={active:false,dx:0,dy:0};}));
}

function switchGun(idx){
  if(idx===undefined)G.gun=(G.gun+1)%GUNS.length;else G.gun=Math.max(0,Math.min(GUNS.length-1,idx));
  const g=GUNS[G.gun];
  document.getElementById('gunicon').textContent=g.icon;
  document.getElementById('gunname').textContent=g.name;
  document.getElementById('gunammo').textContent=G.guns[G.gun].ammo+'/'+g.maxAmmo;
}

function toggleNight(){
  G.nightMode=!G.nightMode;
  document.getElementById('bnight').classList.toggle('on',G.nightMode);
  G.map.setStyle(G.nightMode?STYLES.night:STYLES.streets);
  toast(G.nightMode?'🌙 NIGHT':'☀️ DAY');
}

/* ═══════════════════════════════════════════════════════════════════
   UI BINDINGS
═══════════════════════════════════════════════════════════════════ */
function bindUI(){
  document.getElementById('bmenu').addEventListener('click',()=>{G.screen='menu';document.getElementById('menu').classList.remove('gone');});
  document.getElementById('bveh').addEventListener('click',()=>{if(G.nearbyVehicle)enterVehicle(G.nearbyVehicle);});
  document.getElementById('bnight').addEventListener('click',toggleNight);
  document.getElementById('brain').addEventListener('click',()=>{G.rainMode=!G.rainMode;document.getElementById('brain').classList.toggle('on',G.rainMode);toast(G.rainMode?'🌧 RAIN':'☀️ CLEAR');});
  document.getElementById('bfs').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();});
  document.getElementById('mveh').addEventListener('click',()=>{if(G.nearbyVehicle)enterVehicle(G.nearbyVehicle);});
  document.getElementById('mact').addEventListener('click',()=>{if(G.nearbyVehicle)enterVehicle(G.nearbyVehicle);});
  document.getElementById('mshoot').addEventListener('click',()=>toast('SHOOT — use weapon'));

  // Search
  const si=document.getElementById('sinput'),sr=document.getElementById('sres');
  si.addEventListener('input',()=>{clearTimeout(G.stT);const q=si.value.trim();if(q.length<2){sr.classList.remove('open');return;}G.stT=setTimeout(()=>doSearch(q),400);});
  document.addEventListener('click',e=>{if(!e.target.closest('#sw'))sr.classList.remove('open');});
  async function doSearch(q){
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5`,{headers:{'Accept-Language':'en'}});
      const d=await r.json();
      if(!d.length){sr.innerHTML='<div class="sri" style="color:var(--dm)">No results</div>';sr.classList.add('open');return;}
      sr.innerHTML=d.map(x=>`<div class="sri" data-lng="${x.lon}" data-lat="${x.lat}"><div class="sn">${x.display_name.split(',')[0]}</div><div class="ss">${x.display_name.split(',').slice(1,3).join(',').trim()}</div></div>`).join('');
      sr.classList.add('open');
      sr.querySelectorAll('.sri').forEach(item=>item.addEventListener('click',()=>{
        const lng=parseFloat(item.dataset.lng),lat=parseFloat(item.dataset.lat);
        G.pos.lng=lng;G.pos.lat=lat;
        G.map.flyTo({center:[lng,lat],zoom:17,duration:1400,essential:true});
        sr.classList.remove('open');si.value=item.querySelector('.sn').textContent;
        toast('NAVIGATING — '+item.querySelector('.sn').textContent.toUpperCase());
      }));
    }catch(e){sr.innerHTML='<div class="sri" style="color:var(--r)">Error</div>';sr.classList.add('open');}
  }
}

/* ═══════════════════════════════════════════════════════════════════
   MENU + CHARACTER
═══════════════════════════════════════════════════════════════════ */
function buildMenu(){
  document.getElementById('pname').value=G.name;
  document.getElementById('pname').addEventListener('input',()=>{G.name=document.getElementById('pname').value.trim()||G.name;ls('owName',G.name);});
  const cg=document.getElementById('charsgrid');
  cg.innerHTML=CHARACTERS.map(c=>`<div class="charopt${G.char.id===c.id?' sel':''}" data-cid="${c.id}"><span class="ce">${c.emoji}</span><span class="cname">${c.name}</span><div class="cdesc">${c.desc}</div></div>`).join('');
  cg.querySelectorAll('.charopt').forEach(c=>c.addEventListener('click',()=>{cg.querySelectorAll('.charopt').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');}));

  document.getElementById('charpick').addEventListener('click',()=>document.getElementById('charselect').classList.add('open'));
  document.getElementById('cs-confirm').addEventListener('click',()=>{
    const sel=document.querySelector('#charsgrid .charopt.sel');
    if(sel){const c=CHARACTERS.find(x=>x.id===sel.dataset.cid);if(c){G.char=c;G.color=c.color;}}
    document.getElementById('charselect').classList.remove('open');
    document.getElementById('charpick').textContent=G.char.emoji+' '+G.char.name;
  });
  document.getElementById('charselect').addEventListener('click',e=>{if(e.target===document.getElementById('charselect'))document.getElementById('charselect').classList.remove('open');});

  document.getElementById('mplay').addEventListener('click',startGame);
  document.getElementById('mmis').addEventListener('click',()=>{const m=MISSIONS.find(x=>!G.missionsDone.has(x.id));if(m)startMission(m);});
  document.getElementById('mmlb').addEventListener('click',()=>toast('🏆 Leaderboard — '+G.kills+' kills, '+G.money+'$'));
  document.getElementById('mmhtp').addEventListener('click',()=>document.getElementById('htpover').style.display='flex');
  document.getElementById('htpclose').addEventListener('click',()=>document.getElementById('htpover').style.display='none');
  document.getElementById('htpover').addEventListener('click',e=>{if(e.target===document.getElementById('htpover'))document.getElementById('htpover').style.display='none';});

  document.getElementById('htpcontent').innerHTML=`
    <div style="display:flex;flex-direction:column;gap:12px;">
    ${[
      ['MOVEMENT','W A S D — Move | SHIFT — Sprint'],
      ['VEHICLE','E — Enter/Exit nearest vehicle'],
      ['COMBAT','G / 1-5 — Switch weapon | Click — Shoot'],
      ['WORLD','Search any city above. Camera stays overhead (GTA 1 style).'],
      ['POLICE','Wanted stars rise with crimes. Escape and hide to lose them.'],
      ['MISSIONS','Press M or open Missions from menu.'],
    ].map(([h,b])=>`<div><div style="font-size:11px;font-weight:700;color:var(--a);margin-bottom:4px;">${h}</div><div style="font-family:var(--fm);font-size:8px;color:var(--dm);line-height:1.6;">${b}</div></div>`).join('')}
    </div>`;
}

function startGame(){
  G.screen='game';
  document.getElementById('menu').classList.add('gone');
  toast('🌆 WELCOME TO THE CITY');
  // Update character color
  if(G.char)G.color=G.char.color;
}

function startClock(){
  setInterval(()=>{
    G.gameTime=(G.gameTime+1)%1440;
