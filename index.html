<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050a05">
    <title>OPEN WORLD — GTA TOP-DOWN</title>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --g: #39ff6a; --gd: #1a7a35; --a: #ffb830; --r: #ff3b3b; --b: #4fc3f7;
            --pn: rgba(5, 12, 5, 0.88); --br: rgba(57, 255, 106, 0.22); --tx: #c8f5d2; --dm: #5c8a65;
            --fh: 'Rajdhani', sans-serif; --fm: 'Share Tech Mono', monospace;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--fh); color: var(--tx); user-select: none; }
        
        #map { position: fixed; inset: 0; z-index: 1; background: #111; }
        #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 8; background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 4, 0, 0.7) 100%); }
        #scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 9; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.05) 2px, rgba(0, 0, 0, 0.05) 4px); }
        #dmgflash { position: fixed; inset: 0; pointer-events: none; z-index: 60; background: rgba(255, 0, 0, 0.44); opacity: 0; transition: opacity 0.15s; }
        #dmgflash.on { opacity: 1; }
        canvas#gunlayer { position: fixed; inset: 0; pointer-events: none; z-index: 12; }

        #menu { position: fixed; inset: 0; z-index: 900; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 55%, rgba(57, 255, 106, 0.15) 0%, rgba(0, 4, 0, 0.95) 70%); backdrop-filter: blur(5px); }
        #menu.gone { display: none; }
        .mpanel { position: relative; z-index: 2; width: min(480px, 95vw); display: flex; flex-direction: column; align-items: center; animation: mpIn 0.5s ease; }
        @keyframes mpIn { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
        .mtitle { font-size: clamp(40px, 9vw, 72px); font-weight: 700; letter-spacing: 0.22em; color: var(--g); text-shadow: 0 0 35px var(--g); line-height: 1; }
        .msub { font-family: var(--fm); font-size: 10px; color: var(--dm); letter-spacing: 0.4em; margin: 6px 0 28px; }
        .name-char-row { display: flex; gap: 8px; width: 100%; margin-bottom: 16px; }
        #pname { flex: 1; background: var(--pn); border: 1px solid var(--br); padding: 12px 16px; color: var(--tx); font-size: 16px; font-weight: 600; outline: none; border-radius: 4px; }
        .mbtn { width: 100%; padding: 15px 20px; margin: 6px 0; background: rgba(5, 12, 5, 0.75); border: 1px solid var(--br); border-radius: 4px; font-size: 18px; font-weight: 600; letter-spacing: 0.12em; color: var(--g); cursor: pointer; text-align: center; transition: all 0.2s; }
        .mbtn:hover { background: rgba(57, 255, 106, 0.15); box-shadow: 0 0 20px rgba(57, 255, 106, 0.3); }

        #hud { position: fixed; inset: 0; z-index: 20; pointer-events: none; display: none; flex-direction: column; }
        #hud.on { display: flex; }
        
        #rw { pointer-events: all; position: absolute; bottom: 25px; left: 25px; width: 160px; height: 160px; border-radius: 50%; border: 3px solid var(--g); box-shadow: 0 0 20px rgba(57, 255, 106, 0.4), inset 0 0 20px rgba(0,0,0,0.8); overflow: hidden; background: #000; }
        #minimap { width: 100%; height: 100%; border-radius: 50%; }
        #rsweep { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0deg, rgba(57, 255, 106, 0.2) 60deg, transparent 60deg); animation: sweep 3s linear infinite; }
        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        #rcenter { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; background: var(--g); border-radius: 50%; box-shadow: 0 0 10px var(--g); }

        #gtar { position: absolute; bottom: 25px; right: 25px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        #moneyd { font-family: var(--fm); font-size: 26px; font-weight: 700; color: var(--g); text-shadow: 0 0 15px var(--g); }
        #wantedw { display: flex; gap: 4px; }
        .star { font-size: 18px; color: #1a1a1a; text-shadow: 0 0 2px #000; transition: all 0.2s; }
        .star.lit { color: var(--a); text-shadow: 0 0 8px var(--a); }
        
        .barr { display: flex; align-items: center; gap: 8px; }
        .brl { font-family: var(--fm); font-size: 10px; color: var(--dm); width: 30px; text-align: right; }
        .bro { width: 130px; height: 10px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; }
        .bri { height: 100%; border-radius: 2px; transition: width 0.2s; }
        #hpbar { background: linear-gradient(90deg, #ff4444, #ff7070); }
        #arbar { background: linear-gradient(90deg, #4fc3f7, #81d4fa); }

        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; pointer-events: none; z-index: 14; opacity: 0.7; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: var(--g); box-shadow: 0 0 5px var(--g); }
        #crosshair::before { width: 100%; height: 2px; top: 9px; }
        #crosshair::after { width: 2px; height: 100%; left: 9px; }

        #toast { position: fixed; top: 50px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--pn); border: 1px solid var(--br); padding: 10px 24px; font-family: var(--fm); font-size: 14px; color: var(--g); opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 100; border-radius: 4px; }
        #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

        #missionh { position: absolute; top: 80px; left: 25px; background: var(--pn); border-left: 4px solid var(--a); padding: 15px 20px; border-radius: 0 4px 4px 0; display: none; border: 1px solid var(--br); border-left-width: 4px; border-left-color: var(--a); }
        #missionh.on { display: block; }
        #mname { font-family: var(--fm); font-size: 14px; color: var(--a); margin-bottom: 5px; }
        #mobjective { font-size: 15px; font-weight: 600; color: var(--tx); }

        #overlay { position: fixed; inset: 0; z-index: 500; display: none; align-items: center; justify-content: center; background: rgba(0, 4, 0, 0.92); backdrop-filter: blur(10px); }
        #overlay.open { display: flex; }
        .modal { width: min(600px, 95vw); background: var(--pn); border: 1px solid var(--br); border-radius: 8px; padding: 25px; }
        .modal h2 { font-family: var(--fm); color: var(--g); margin-bottom: 15px; }
        .mission-item { display: flex; gap: 15px; padding: 15px; border-bottom: 1px solid #333; cursor: pointer; transition: background 0.2s; }
        .mission-item:hover { background: rgba(57, 255, 106, 0.1); }
        .mission-icon { font-size: 30px; }
        .mission-info { flex: 1; }
        .mission-name { font-size: 18px; font-weight: 700; }
        .mission-desc { font-size: 13px; color: var(--dm); }
        .mission-reward { font-family: var(--fm); color: var(--a); margin-top: 5px; }
        .close-btn { background: var(--r); color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-family: var(--fm); margin-top: 15px; width: 100%; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="vignette"></div>
    <div id="scanlines"></div>
    <div id="dmgflash"></div>
    <canvas id="gunlayer"></canvas>

    <div id="hud">
        <div id="rw">
            <div id="minimap"></div>
            <div id="rsweep"></div>
            <div id="rcenter"></div>
        </div>
        <div id="gtar">
            <div id="moneyd">$0</div>
            <div id="wantedw">
                <span class="star" id="s1">★</span><span class="star" id="s2">★</span>
                <span class="star" id="s3">★</span><span class="star" id="s4">★</span><span class="star" id="s5">★</span>
            </div>
            <div class="barr"><span class="brl">HP</span><div class="bro"><div class="bri" id="hpbar" style="width:100%"></div></div></div>
            <div class="barr"><span class="brl">ARM</span><div class="bro"><div class="bri" id="arbar" style="width:75%"></div></div></div>
        </div>
        <div id="crosshair"></div>
        <div id="missionh">
            <div id="mname">MISSION</div>
            <div id="mobjective">Objective</div>
        </div>
    </div>
    <div id="toast"></div>

    <div id="menu">
        <div class="mpanel">
            <div class="mtitle">OPEN WORLD</div>
            <div class="msub">GTA TOP-DOWN ENGINE</div>
            <div class="name-char-row">
                <input type="text" id="pname" value="Player_01" maxlength="14" autocomplete="off">
            </div>
            <button class="mbtn" id="mplay">▶ ENTER THE CITY</button>
        </div>
    </div>

    <div id="overlay">
        <div class="modal">
            <h2>📋 AVAILABLE MISSIONS</h2>
            <div id="mission-list"></div>
            <button class="close-btn" onclick="document.getElementById('overlay').classList.remove('open')">CLOSE</button>
        </div>
    </div>

    <script>
    // ─── GAME STATE ─────────────────────────────────────────────────
    const G = {
        screen: 'menu', name: 'Player',
        pos: { lng: -73.985, lat: 40.758 }, // Times Square
        heading: 0, speed: 0,
        vx: 0, vy: 0,
        vehicleMode: false,
        health: 100, armor: 75, money: 0,
        wanted: 0, wantedTimer: null,
        map: null, minimap: null,
        playerMarker: null,
        keys: {},
        entities: [], // NPCs, Peds, Cars
        // Physics constants (meters per second, scaled for map)
        FOOT_SPEED: 3.5,      // m/s
        CAR_SPEED: 18.0,       // m/s
        FRICTION: 0.85,
        // Raycast
        lastShot: 0
    };

    // ─── INIT ───────────────────────────────────────────────────────
    document.getElementById('mplay').addEventListener('click', () => {
        G.name = document.getElementById('pname').value || 'Player';
        document.getElementById('menu').classList.add('gone');
        document.getElementById('hud').classList.add('on');
        G.screen = 'game';
        initMap();
        initMissions();
        bindControls();
        spawnEntities();
        requestAnimationFrame(gameLoop);
        toast('Welcome to the streets, ' + G.name);
    });

    function initMap() {
        G.map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [G.pos.lng, G.pos.lat],
            zoom: 16.5,
            pitch: 65,
            bearing: 0,
            antialias: true,
            attributionControl: false,
            maxZoom: 19
        });

        G.map.on('load', () => {
            // Minimap
            G.minimap = new maplibregl.Map({
                container: 'minimap',
                style: 'https://tiles.openfreemap.org/styles/positron',
                center: [G.pos.lng, G.pos.lat],
                zoom: 14,
                interactive: false,
                attributionControl: false,
                pitch: 0
            });

            // Player marker
            const el = document.createElement('div');
            el.innerHTML = `<div style="width:20px;height:20px;background:var(--g);border-radius:50%;border:3px solid #fff;box-shadow:0 0 20px var(--g);"></div>`;
            G.playerMarker = new maplibregl.Marker({ element: el, anchor: 'center' })
                .setLngLat([G.pos.lng, G.pos.lat]).addTo(G.map);

            // GPS line source
            G.map.addSource('gps', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } } });
            G.map.addLayer({
                id: 'gps', type: 'line', source: 'gps',
                paint: { 'line-color': '#ffb830', 'line-width': 5, 'line-dasharray': [2, 2], 'line-opacity': 0.8 }
            });
        });

        // Shooting on double-click
        let lastClick = 0;
        G.map.on('click', (e) => {
            const now = Date.now();
            if (now - lastClick < 300) fireWeapon(e.lngLat.lng, e.lngLat.lat);
            lastClick = now;
        });
    }

    // ─── GAME LOOP (Fixed timestep) ────────────────────────────────
    let lastTime = performance.now();
    function gameLoop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.1); // seconds
        lastTime = now;

        if (G.screen === 'game') {
            updatePhysics(dt);
            updateCamera();
            updateEntities(dt);
            updateMissionTracker();
            checkPoliceCollision();
        }
        requestAnimationFrame(gameLoop);
    }

    // ─── PHYSICS (GTA-style) ────────────────────────────────────────
    function updatePhysics(dt) {
        const maxSpeed = G.vehicleMode ? G.CAR_SPEED : G.FOOT_SPEED;
        const rad = (G.heading * Math.PI) / 180;
        let ax = 0, ay = 0;

        if (G.keys['w'] || G.keys['arrowup']) { ax -= Math.sin(rad); ay += Math.cos(rad); }
        if (G.keys['s'] || G.keys['arrowdown']) { ax += Math.sin(rad); ay -= Math.cos(rad); }
        if (G.keys['a'] || G.keys['arrowleft']) { ax -= Math.cos(rad); ay -= Math.sin(rad); }
        if (G.keys['d'] || G.keys['arrowright']) { ax += Math.cos(rad); ay += Math.sin(rad); }

        const mg = Math.sqrt(ax * ax + ay * ay);
        if (mg > 1) { ax /= mg; ay /= mg; }

        // Acceleration (m/s²)
        const accel = G.vehicleMode ? 8.0 : 4.0;
        G.vx += ax * accel * dt;
        G.vy += ay * accel * dt;

        // Friction
        G.vx *= Math.pow(G.FRICTION, dt * 60);
        G.vy *= Math.pow(G.FRICTION, dt * 60);

        // Cap speed
        const speed = Math.sqrt(G.vx * G.vx + G.vy * G.vy);
        if (speed > maxSpeed) {
            G.vx = (G.vx / speed) * maxSpeed;
            G.vy = (G.vy / speed) * maxSpeed;
        }

        // Update position (convert m/s to degrees: 1 deg ≈ 111,320 m)
        const degPerMeter = 1 / 111320;
        G.pos.lng += G.vx * degPerMeter * dt;
        G.pos.lat += G.vy * degPerMeter * dt;

        // Update heading based on movement direction
        if (speed > 0.1) {
            G.heading = Math.atan2(-G.vx, G.vy) * 180 / Math.PI;
        }

        // Update marker
        G.playerMarker.setLngLat([G.pos.lng, G.pos.lat]);
    }

    // ─── CAMERA FOLLOW (Smooth, not jittery) ──────────────────────
    function updateCamera() {
        if (!G.map) return;
        // Only ease when the player moves; otherwise idle
        if (G.speed > 0.1) {
            G.map.easeTo({
                center: [G.pos.lng, G.pos.lat],
                bearing: G.heading,
                duration: 100,
                easing: (t) => t * (2 - t) // easeOutQuad
            });
        }
        if (G.minimap) G.minimap.setCenter([G.pos.lng, G.pos.lat]);
    }

    // ─── ENTITIES (NPCs) ───────────────────────────────────────────
    function spawnEntities() {
        // Spawn 15 pedestrians and 5 cars around the player
        for (let i = 0; i < 20; i++) {
            const isCar = i < 5;
            const angle = Math.random() * Math.PI * 2;
            const dist = 0.002 + Math.random() * 0.005;
            const eLng = G.pos.lng + Math.cos(angle) * dist;
            const eLat = G.pos.lat + Math.sin(angle) * dist;

            const el = document.createElement('div');
            el.innerHTML = isCar ? '🚗' : '🚶';
            el.style.fontSize = isCar ? '24px' : '18px';
            el.style.filter = 'drop-shadow(0 0 5px rgba(0,0,0,0.8))';

            const marker = new maplibregl.Marker({ element: el, anchor: 'center' })
                .setLngLat([eLng, eLat]).addTo(G.map);

            G.entities.push({
                id: Math.random().toString(36).substr(2, 9),
                type: isCar ? 'car' : 'ped',
                lng: eLng, lat: eLat,
                vx: 0, vy: 0,
                hp: isCar ? 100 : 30,
                marker: marker,
                isPolice: false,
                state: 'wander' // wander, chase, flee
            });
        }
    }

    function updateEntities(dt) {
        const degPerMeter = 1 / 111320;
        G.entities.forEach(e => {
            if (e.isPolice) {
                // Police chase player
                const dx = G.pos.lng - e.lng;
                const dy = G.pos.lat - e.lat;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0.00005) {
                    const speed = 15.0; // m/s
                    e.vx = (dx / dist) * speed;
                    e.vy = (dy / dist) * speed;
                }
            } else {
                // Wandering AI
                if (Math.random() < 0.02) {
                    e.vx = (Math.random() - 0.5) * 4.0;
                    e.vy = (Math.random() - 0.5) * 4.0;
                }
                // Flee if player is close
                const dx = e.lng - G.pos.lng;
                const dy = e.lat - G.pos.lat;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 0.0005) {
                    e.vx += (dx / dist) * 2.0;
                    e.vy += (dy / dist) * 2.0;
                }
            }

            // Apply friction
            e.vx *= Math.pow(0.9, dt * 60);
            e.vy *= Math.pow(0.9, dt * 60);

            // Update position
            e.lng += e.vx * degPerMeter * dt;
            e.lat += e.vy * degPerMeter * dt;
            e.marker.setLngLat([e.lng, e.lat]);
        });
    }

    // ─── COMBAT (Raycast from player) ─────────────────────────────
    function fireWeapon(targetLng, targetLat) {
        const ctx = document.getElementById('gunlayer').getContext('2d');
        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

        const from = G.map.project([G.pos.lng, G.pos.lat]);
        const to = G.map.project([targetLng, targetLat]);

        // Draw tracer
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.strokeStyle = 'rgba(255, 220, 80, 0.9)';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffb830';
        ctx.stroke();

        // Muzzle flash
        ctx.beginPath();
        ctx.arc(from.x, from.y, 12, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();

        setTimeout(() => ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height), 80);

        // Hit detection: check entities within 10m of the click point
        const clickLng = targetLng;
        const clickLat = targetLat;
        G.entities.forEach((e, index) => {
            const dist = Math.sqrt(
                Math.pow(e.lng - clickLng, 2) + Math.pow(e.lat - clickLat, 2)
            ) * 111320; // convert to meters
            if (dist < 10) {
                e.hp -= 50;
                if (e.hp <= 0) {
                    e.marker.remove();
                    G.entities.splice(index, 1);
                    addMoney(e.isPolice ? 500 : 50);
                    if (!e.isPolice) addWanted();
                }
            }
        });
    }

    // ─── WANTED SYSTEM ─────────────────────────────────────────────
    function addWanted() {
        if (G.wanted >= 5) return;
        G.wanted++;
        updateHUD();
        toast('⚠️ WANTED LEVEL INCREASED', 'warn');
        if (G.wanted >= 2) spawnPolice();
        clearTimeout(G.wantedTimer);
        G.wantedTimer = setTimeout(() => {
            G.wanted = Math.max(0, G.wanted - 1);
            updateHUD();
            if (G.wanted >= 2) spawnPolice();
        }, 15000);
    }

    function spawnPolice() {
        const spawnCount = Math.min(G.wanted, 3);
        const currentPolice = G.entities.filter(e => e.isPolice).length;
        for (let i = currentPolice; i < spawnCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const eLng = G.pos.lng + Math.cos(angle) * 0.005;
            const eLat = G.pos.lat + Math.sin(angle) * 0.005;
            const el = document.createElement('div');
            el.innerHTML = '🚓';
            el.style.fontSize = '28px';
            el.style.filter = 'drop-shadow(0 0 8px red)';
            const marker = new maplibregl.Marker({ element: el, anchor: 'center' })
                .setLngLat([eLng, eLat]).addTo(G.map);
            G.entities.push({
                id: 'police_' + Math.random(), type: 'car', isPolice: true,
                lng: eLng, lat: eLat, vx: 0, vy: 0, hp: 200, marker: marker
            });
        }
    }

    function checkPoliceCollision() {
        if (G.wanted === 0) return;
        G.entities.forEach(e => {
            if (e.isPolice) {
                const dist = Math.sqrt(
                    Math.pow(e.lng - G.pos.lng, 2) + Math.pow(e.lat - G.pos.lat, 2)
                ) * 111320;
                if (dist < 5) { // 5 meters
                    takeDamage(15);
                    G.vx -= e.vx * 0.5;
                    G.vy -= e.vy * 0.5;
                }
            }
        });
    }

    function takeDamage(amt) {
        G.armor -= amt;
        if (G.armor < 0) { G.health += G.armor; G.armor = 0; }
        const flash = document.getElementById('dmgflash');
        flash.classList.add('on');
        setTimeout(() => flash.classList.remove('on'), 100);
        updateHUD();
        if (G.health <= 0) {
            toast('💀 WASTED', 'warn');
            G.health = 100; G.armor = 75; G.wanted = 0;
            G.pos = { lng: -73.985, lat: 40.758 };
            G.entities.filter(e => e.isPolice).forEach(e => e.marker.remove());
            G.entities = G.entities.filter(e => !e.isPolice);
            updateHUD();
        }
    }

    // ─── MISSIONS & GPS ────────────────────────────────────────────
    const MISSIONS = [
        { id: 1, name: 'First Delivery', desc: 'Deliver the package to the marked location.', reward: 1500 },
        { id: 2, name: 'Street Sweep', desc: 'Eliminate 3 targets roaming the streets.', reward: 3000 }
    ];

    function initMissions() {
        const list = document.getElementById('mission-list');
        list.innerHTML = MISSIONS.map(m => `
            <div class="mission-item" onclick="startMission(${m.id}, ${m.reward})">
                <div class="mission-icon">📦</div>
                <div class="mission-info">
                    <div class="mission-name">${m.name}</div>
                    <div class="mission-desc">${m.desc}</div>
                    <div class="mission-reward">+$${m.reward}</div>
                </div>
            </div>
        `).join('');
    }

    function startMission(id, reward) {
        document.getElementById('overlay').classList.remove('open');
        G.activeMission = { id, reward };
        const angle = Math.random() * Math.PI * 2;
        const dist = 0.01 + Math.random() * 0.01;
        G.missionTarget = {
            lng: G.pos.lng + Math.cos(angle) * dist,
            lat: G.pos.lat + Math.sin(angle) * dist
        };
        if (G.waypointMarker) G.waypointMarker.remove();
        const el = document.createElement('div');
        el.innerHTML = `<div style="width:30px;height:30px;background:var(--a);border-radius:50%;border:3px solid #fff;box-shadow:0 0 20px var(--a);animation:pulse 1s infinite alternate;"></div>`;
        G.waypointMarker = new maplibregl.Marker({ element: el, anchor: 'center' })
            .setLngLat([G.missionTarget.lng, G.missionTarget.lat]).addTo(G.map);
        document.getElementById('missionh').classList.add('on');
        document.getElementById('mname').textContent = MISSIONS.find(m => m.id === id).name;
        document.getElementById('mobjective').textContent = 'Follow the GPS route';
        toast('📋 MISSION STARTED', 'gold');
    }

    function updateMissionTracker() {
        if (!G.activeMission || !G.missionTarget) return;
        // Draw GPS line
        if (G.map.getSource('gps')) {
            G.map.getSource('gps').setData({
                type: 'Feature',
                geometry: { type: 'LineString', coordinates: [[G.pos.lng, G.pos.lat], [G.missionTarget.lng, G.missionTarget.lat]] }
            });
        }
        // Check distance
        const dist = Math.sqrt(
            Math.pow(G.pos.lng - G.missionTarget.lng, 2) + Math.pow(G.pos.lat - G.missionTarget.lat, 2)
        ) * 111320;
        if (dist < 20) { // 20 meters
            addMoney(G.activeMission.reward);
            toast(`✅ MISSION COMPLETE +$${G.activeMission.reward}`, 'gold');
            if (G.waypointMarker) G.waypointMarker.remove();
            G.map.getSource('gps').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: [] } });
            G.activeMission = null;
            document.getElementById('missionh').classList.remove('on');
        }
    }

    // ─── UI & CONTROLS ─────────────────────────────────────────────
    function bindControls() {
        document.addEventListener('keydown', (e) => {
            G.keys[e.key.toLowerCase()] = true;
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key)) e.preventDefault();
            const k = e.key.toLowerCase();
            if (k === 'v') {
                G.vehicleMode = !G.vehicleMode;
                toast(G.vehicleMode ? '🚗 Vehicle Mode' : '🚶 On Foot');
            }
            if (k === 'm') document.getElementById('overlay').classList.add('open');
            if (k === 'escape') document.getElementById('overlay').classList.remove('open');
        });
        document.addEventListener('keyup', (e) => { G.keys[e.key.toLowerCase()] = false; });
        window.addEventListener('resize', () => {
            const c = document.getElementById('gunlayer');
            c.width = window.innerWidth; c.height = window.innerHeight;
        });
        document.getElementById('gunlayer').width = window.innerWidth;
        document.getElementById('gunlayer').height = window.innerHeight;
    }

    function updateHUD() {
        document.getElementById('moneyd').textContent = '$' + G.money.toLocaleString();
        document.getElementById('hpbar').style.width = G.health + '%';
        document.getElementById('arbar').style.width = G.armor + '%';
        for (let i = 1; i <= 5; i++) {
            document.getElementById('s' + i).classList.toggle('lit', i <= G.wanted);
        }
    }

    function addMoney(amt) {
        G.money += amt;
        updateHUD();
    }

    function toast(msg, type = '') {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'on ' + type;
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove('on'), 3000);
    }
    </script>
</body>
</html>
